<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗記カード | 資格勉強OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#080c17;--card:#12182a;--text:#f5f7ff;--muted:#98a3bf;--accent:#8b5cf6;--good:#34d399;--bad:#fb7185;--line:#26314d}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:18px 18px 70px;background:radial-gradient(circle at top left,#1a1640 0,#090e1a 42%,#050812 100%);color:var(--text)}h1{margin:0 0 4px}h2,h3{margin-top:0}.muted{color:var(--muted)}.small{font-size:13px}.card{background:linear-gradient(145deg,rgba(18,24,42,.96),rgba(10,15,28,.98));border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0;background:#0f1627}.item:hover{border-color:#53638f}button{border:0;border-radius:11px;padding:10px 15px;font-weight:850;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.light{background:#222b43;color:#e8ecff;border:1px solid #33405f}.danger{background:#3d1725;color:#ffc1cf;border:1px solid #6b2941}input,textarea{width:100%;padding:11px;border:1px solid #394563;border-radius:11px;background:#0c1322;color:#f4f6ff;font-size:16px}textarea{min-height:140px}label{display:block;font-weight:800;margin:10px 0 6px}.hidden{display:none!important}.timer{font-size:42px;font-weight:950}.flash{min-height:280px;display:flex;flex-direction:column;justify-content:center;text-align:center}.prompt{font-size:30px;font-weight:900;margin:20px 0}.answer{font-size:24px;font-weight:800;margin:18px 0;padding:16px;border:1px dashed #526184;border-radius:14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{text-align:left;min-height:64px}.correct{border-color:var(--good)!important}.incorrect{border-color:var(--bad)!important}.badge{display:inline-block;border:1px solid #45337c;background:#261b50;color:#d7ceff;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}@media(max-width:700px){body{padding:12px 12px 60px}.grid,.choice{grid-template-columns:1fr}.prompt{font-size:25px}}</style></head><body><div id="auth" class="card hidden"><h2>📚 資格勉強OS</h2><p class="muted">Googleでログインしてください。</p><button class="primary" onclick="login()">Googleでログイン</button></div><div id="app" class="hidden"><header class="row" style="justify-content:space-between"><div><h1>🧠 暗記カード</h1><div class="muted small">復習スケジュールとは完全に別管理</div></div><button class="light" onclick="location.href='index.html'">← 資格勉強OS</button></header><section id="home"><div class="card"><div class="row" style="justify-content:space-between"><h2>暗記ファイル</h2><button class="primary" onclick="showDeckForm()">＋ ファイル作成</button></div><p class="muted small">ファイルごとにカードの出題範囲を分けます。</p><div id="decks"></div></div><div class="card"><h2>最近の暗記履歴</h2><div id="history"></div></div></section><section id="deckForm" class="card hidden"><h2 id="deckFormTitle">ファイル作成</h2><label>ファイル名</label><input id="deckName" placeholder="例：消費税区分"><label>説明（任意）</label><input id="deckDescription"><div class="row" style="margin-top:12px"><button class="primary" onclick="saveDeck()">保存</button><button class="light" onclick="showHome()">戻る</button></div></section><section id="deck" class="hidden"></section><section id="manage" class="hidden"></section><section id="session" class="hidden"></section></div><div id="toast" style="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101827;border:1px solid #354361;padding:11px 15px;border-radius:12px;display:none"></div><script>
const sb=window.supabase.createClient('https://txprypfzdsfaupguhybl.supabase.co','sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36');let user=null,decks=[],currentDeck=null,currentCards=[],session=null,sessionCards=[],idx=0,answerShown=false,paused=false,timerHandle=null,startedAt=0,elapsed=0,sessionCorrect=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+'分'+s%60+'秒'}async function boot(){const{data:{session:s}}=await sb.auth.getSession();if(s){user=s.user;$('app').classList.remove('hidden');loadHome()}else $('auth').classList.remove('hidden')}async function login(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})}async function loadHome(){await loadDecks();await loadHistory();showHome()}async function loadDecks(){const{data,error}=await sb.from('flashcard_decks').select('*').eq('archived',false).order('created_at');if(error)return toast(error.message);decks=data||[];$('decks').innerHTML=decks.length?decks.map(d=>`<div class="item"><div class="row" style="justify-content:space-between"><div><b>${esc(d.name)}</b><div class="muted small">${esc(d.description||'')}</div></div><span class="badge" id="count-${d.id}">…</span></div><div class="row" style="margin-top:10px"><button class="primary" onclick="openDeck('${d.id}')">開く</button><button class="light" onclick="editDeck('${d.id}')">編集</button><button class="danger" onclick="archiveDeck('${d.id}')">削除</button></div></div>`).join(''):'<p class="muted">まだファイルがありません。</p>';for(const d of decks){const{count}=await sb.from('flashcards').select('*',{count:'exact',head:true}).eq('deck_id',d.id);$('count-'+d.id).textContent=(count||0)+'枚'}}async function loadHistory(){const{data}=await sb.from('flashcard_sessions').select('*,flashcard_decks(name)').order('created_at',{ascending:false}).limit(10);$('history').innerHTML=data?.length?data.map(x=>`<div class="item"><b>${esc(x.flashcard_decks?.name||'')}</b> <span class="badge">${x.mode==='choice'?'4択':'自由回答'}</span><div class="muted small">${new Date(x.started_at).toLocaleString('ja-JP')} ・ ${x.card_count}枚 ・ ${fmt(x.duration_seconds)}${x.mode==='choice'?' ・ 正解'+x.correct_count+'問':''}</div></div>`).join(''):'<p class="muted">まだ履歴がありません。</p>'}function hideAll(){['home','deckForm','deck','manage','session'].forEach(id=>$(id).classList.add('hidden'))}function showHome(){hideAll();$('home').classList.remove('hidden');loadDecks();loadHistory()}function showDeckForm(d=null){hideAll();$('deckForm').classList.remove('hidden');$('deckFormTitle').textContent=d?'ファイル編集':'ファイル作成';$('deckForm').dataset.id=d?.id||'';$('deckName').value=d?.name||'';$('deckDescription').value=d?.description||''}async function saveDeck(){const name=$('deckName').value.trim();if(!name)return toast('ファイル名を入力してください');const id=$('deckForm').dataset.id;const payload={name,description:$('deckDescription').value.trim()};const q=id?sb.from('flashcard_decks').update(payload).eq('id',id):sb.from('flashcard_decks').insert({...payload,user_id:user.id});const{error}=await q;if(error)return toast(error.message);await loadDecks();showHome()}function editDeck(id){showDeckForm(decks.find(d=>d.id===id))}async function archiveDeck(id){if(!confirm('このファイルを削除しますか？カードも削除されます。'))return;const{error}=await sb.from('flashcard_decks').update({archived:true}).eq('id',id);if(error)return toast(error.message);loadHome()}async function openDeck(id){currentDeck=decks.find(d=>d.id===id);const{data,error}=await sb.from('flashcards').select('*').eq('deck_id',id).order('created_at');if(error)return toast(error.message);currentCards=data||[];hideAll();$('deck').classList.remove('hidden');$('deck').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(currentDeck.name)}</h2><div class="muted">${currentCards.length}枚</div></div><button class="light" onclick="showHome()">← 戻る</button></div><div class="row" style="margin:14px 0"><button class="primary" onclick="startSession('free')">自由回答で暗記</button><button class="primary" onclick="startSession('choice')">4択で暗記</button><button class="light" onclick="manageCards()">カードを管理</button></div></div>`}function manageCards(){hideAll();$('manage').classList.remove('hidden');$('manage').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📝 ${esc(currentDeck.name)}</h2><button class="light" onclick="openDeck('${currentDeck.id}')">戻る</button></div><p class="muted small">A｜A' の形式で1行1カード。登録すると既存カードを入れ替えます。</p><textarea id="bulk" placeholder="課税売上げ｜課税\n非課税売上げ｜非課税\n不課税取引｜不課税"></textarea><button class="primary" style="margin-top:10px" onclick="replaceCards()">この内容で登録</button></div><div class="card"><h3>登録済みカード</h3>${currentCards.length?currentCards.map(c=>`<div class="item"><b>${esc(c.prompt)}</b><div class="muted">${esc(c.answer)}</div></div>`).join(''):'<p class="muted">まだカードがありません。</p>'}</div>`}async function replaceCards(){const parsed=$('bulk').value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('｜');return p.length>=2?{prompt:p[0].trim(),answer:p.slice(1).join('｜').trim()}:null}).filter(Boolean);if(!parsed.length)return toast('A｜A\' の形式で入力してください');if(!confirm('既存カードを削除して入れ替えます。よろしいですか？'))return;let r=await sb.from('flashcards').delete().eq('deck_id',currentDeck.id);if(r.error)return toast(r.error.message);r=await sb.from('flashcards').insert(parsed.map(x=>({...x,deck_id:currentDeck.id,user_id:user.id})));if(r.error)return toast(r.error.message);toast(parsed.length+'枚登録しました');openDeck(currentDeck.id)}async function startSession(mode){if(!currentCards.length)return toast('カードを1枚以上登録してください');if(mode==='choice'&&currentCards.length<4)return toast('4択には4枚以上のカードが必要です');const{data,error}=await sb.from('flashcard_sessions').insert({user_id:user.id,deck_id:currentDeck.id,mode}).select().single();if(error)return toast(error.message);session=data;sessionCards=[...currentCards].sort(()=>Math.random()-.5);idx=0;answerShown=false;paused=false;elapsed=0;sessionCorrect=0;startedAt=Date.now();hideAll();$('session').classList.remove('hidden');renderSession();timerHandle=setInterval(()=>{if(!paused){elapsed=Math.floor((Date.now()-startedAt)/1000);if($('timer'))$('timer').textContent=fmt(elapsed)}},500)}function renderSession(){const c=sessionCards[idx];$('session').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="badge">${session.mode==='choice'?'4択':'自由回答'} ・ ${idx+1}/${sessionCards.length}</span><span id="timer" class="timer" style="font-size:28px">${fmt(elapsed)}</span></div><div class="row" style="justify-content:center;margin:8px 0"><button class="light" onclick="togglePause()">${paused?'再開':'一時停止'}</button><button class="danger" onclick="endSession()">終了</button></div><div class="flash"><div class="muted small">問題</div><div class="prompt">${esc(c.prompt)} = ?</div><div id="body"></div></div></div>`;session.mode==='free'?renderFree():renderChoice()}function renderFree(){$('body').innerHTML=(answerShown?`<div class="answer">${esc(sessionCards[idx].answer)}</div>`:'<p class="muted">頭の中で答えてから「答えを見る」</p>')+`<button class="primary" onclick="reveal()">${answerShown?'次へ':'答えを見る'}</button>`}function renderChoice(){const c=sessionCards[idx],opts=[c,...currentCards.filter(x=>x.id!==c.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('body').innerHTML='<div class="choice">'+opts.map(o=>`<button class="light" onclick="choose('${o.id}')">${esc(o.answer)}</button>`).join('')+'</div>'}function reveal(){if(!answerShown){answerShown=true;renderSession()}else{recordCard('revealed');nextCard()}}async function choose(id){const c=sessionCards[idx],ok=id===c.id;sessionCorrect+=ok?1:0;await recordCard(ok?'correct':'incorrect');$('body').innerHTML=`<div class="answer ${ok?'correct':'incorrect'}">${ok?'⭕ 正解':'❌ 不正解'}<br>${esc(c.answer)}</div><button class="primary" onclick="nextCard()">次へ</button>`}async function recordCard(result){await sb.from('flashcard_session_cards').insert({user_id:user.id,session_id:session.id,flashcard_id:sessionCards[idx].id,result})}function nextCard(){if(idx>=sessionCards.length-1){endSession();return}idx++;answerShown=false;renderSession()}function togglePause(){if(!paused)elapsed=Math.floor((Date.now()-startedAt)/1000);else startedAt=Date.now()-elapsed*1000;paused=!paused;renderSession()}async function endSession(){if(!session)return;clearInterval(timerHandle);if(!paused)elapsed=Math.floor((Date.now()-startedAt)/1000);const count=Math.min(idx+(answerShown||session.mode==='choice'?1:0),sessionCards.length);const{error}=await sb.from('flashcard_sessions').update({ended_at:new Date().toISOString(),duration_seconds:elapsed,card_count:count,correct_count:sessionCorrect}).eq('id',session.id);if(error)return toast(error.message);session=null;toast('暗記セッションを記録しました');await loadHistory();setTimeout(showHome,500)}boot();</script></body></html>
