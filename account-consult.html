<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勘定科目相談 | 資格勉強OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:980px;margin:auto;padding:18px;background:#080c17;color:#f5f7ff}h1,h2,h3{margin:0}.muted{color:#98a3bf}.small{font-size:13px}.card{background:#12182a;border:1px solid #26314d;border-radius:18px;padding:18px;margin:14px 0}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#8b5cf6;color:#fff}.light{background:#222b43;color:#e8ecff;border:1px solid #33405f}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{padding:7px;background:#11182a;border:1px solid #26314d;border-radius:14px}.tab{flex:1;background:#11182a;color:#aeb8d3;border:1px solid #2b3550}.tab.active{background:#30205f;color:#fff}.hidden{display:none!important}input{width:100%;padding:13px;border:1px solid #394563;border-radius:11px;background:#0c1322;color:#fff;font-size:16px;margin-top:8px}.notice{padding:12px;margin-top:12px;border-radius:12px;background:#151d32;border:1px solid #33405f}.answer{white-space:pre-wrap;line-height:1.7;margin-top:12px}.topic{padding:15px;border:1px solid #33405f;border-radius:14px;background:#0f1627;margin-top:10px}.q{padding:11px;margin-top:9px;border-radius:10px;background:#0c1322}.chip{display:inline-block;padding:4px 9px;margin:3px;border-radius:99px;background:#17243a;border:1px solid #334b72;font-size:12px}.empty{text-align:center;padding:30px;color:#98a3bf;border:1px dashed #33405f;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<div id="auth" class="card hidden"><h2>🧾 勘定科目相談</h2><p class="muted">資格OSと同じアカウントでログインしてください。</p><button class="primary" onclick="login()">Googleでログイン</button><p id="authErr"></p></div>
<div id="app" class="hidden">
<header style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="small muted">ACCOUNTING CONSULT</div><h1>🧾 勘定科目相談</h1><div class="muted small">自分専用の相談・知識カード</div></div><div class="actions"><button class="light" onclick="location.href='index.html'">← 資格OS</button><button class="light" onclick="logout()">ログアウト</button></div></header>
<nav class="tabs"><button id="tc" class="tab active" onclick="showTab('consult')">相談する</button><button id="th" class="tab" onclick="showTab('history')">過去の相談</button><button id="tb" class="tab" onclick="showTab('box')">勘定科目BOX</button></nav>
<section id="consult"><div class="card"><h2>新しく相談する</h2><p class="muted">既存テーマとの関連もAIが判定します。</p><input id="question" maxlength="300" placeholder="例：会費、商店街の会費、SDカード、駐車場代"><div class="actions"><button id="ask" class="primary" onclick="askAI()">🤖 AIに相談する</button><button class="light" onclick="manualSave()">相談だけ保存</button></div><div id="status" class="notice hidden"></div><div id="result" class="card hidden"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>相談テーマ <span id="count" class="chip">0件</span></h2><input id="search" placeholder="テーマ・相談内容を検索" oninput="renderHistory()"><div id="topics"></div></div></section>
<section id="box" class="hidden"><div class="card"><h2>勘定科目BOX</h2><div id="accounts"></div></div></section>
</div>
<script>
const URL='https://txprypfzdsfaupguhybl.supabase.co';
const KEY='sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,topics=[],consultations=[],accounts=[],relations=[],activeTopicId=null,lastAI=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=s=>{const d=new Date(s);return isNaN(d)?'—':d.toLocaleString('ja-JP')};
const setStatus=(m,e=false)=>{const x=document.getElementById('status');x.classList.remove('hidden');x.style.borderColor=e?'#6b2941':'#33405f';x.innerHTML=m};
async function login(){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)document.getElementById('authErr').textContent=r.error.message}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){document.getElementById('auth').classList.remove('hidden');return}user=data.session.user;document.getElementById('app').classList.remove('hidden');await load();}catch(e){document.getElementById('auth').classList.remove('hidden');document.getElementById('authErr').textContent='読み込みエラー：'+(e.message||e)}}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload();if(event==='SIGNED_IN'&&session&&!user)boot()});
async function load(){const [t,c,a,r]=await Promise.all([sb.from('accounting_topics').select('*').eq('user_id',user.id).order('updated_at',{ascending:false}),sb.from('accounting_consultations').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('accounting_accounts').select('*').eq('user_id',user.id).eq('archived',false).order('sort_order').order('name'),sb.from('accounting_consultation_accounts').select('*').eq('user_id',user.id)]);for(const z of [t,c,a,r])if(z.error)throw z.error;topics=t.data||[];consultations=c.data||[];accounts=a.data||[];relations=r.data||[];renderHistory();renderAccounts()}
function showTab(n){['consult','history','box'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==n);document.getElementById('t'+x[0]).classList.toggle('active',x===n)});if(n==='history')renderHistory()}
function renderHistory(){const q=(document.getElementById('search')?.value||'').toLowerCase();const list=topics.filter(t=>(t.title+' '+(t.summary||'')+' '+consultations.filter(c=>c.topic_id===t.id).map(c=>c.question+' '+(c.ai_answer||'')).join(' ')).toLowerCase().includes(q));document.getElementById('count').textContent=list.length+'件';document.getElementById('topics').innerHTML=list.length?list.map(t=>{const cs=consultations.filter(c=>c.topic_id===t.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return `<article class="topic"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="small muted">テーマ</div><h3>${esc(t.title)}</h3><div class="small muted">${cs.length}件 ・ ${fmt(t.updated_at)}</div></div><button class="primary" onclick="openTopic('${t.id}')">このテーマで相談</button></div>${t.summary?`<p class="muted small">${esc(t.summary)}</p>`:''}${cs.slice(-6).map(c=>`<div class="q"><b>${esc(c.question)}</b><div class="small muted">${fmt(c.created_at)}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(c.ai_answer||'相談のみ保存')}</div></div>`).join('')}</article>`}).join(''):'<div class="empty">まだテーマがありません。</div>'}
function renderAccounts(){const cnt={};relations.forEach(r=>cnt[r.account_id]=(cnt[r.account_id]||0)+1);document.getElementById('accounts').innerHTML=accounts.length?accounts.map(a=>`<div class="topic"><b>${esc(a.name)}</b><div class="small muted">関連相談 ${cnt[a.id]||0}件</div></div>`).join(''):'<div class="empty">勘定科目がありません。</div>'}
function openTopic(id){activeTopicId=id;showTab('consult');const t=topics.find(x=>x.id===id);document.getElementById('question').placeholder='「'+(t?.title||'このテーマ')+'」について追加で質問';document.getElementById('question').focus();setStatus('現在のテーマ：<b>'+esc(t?.title||'')+'</b>')}
function newConsult(){activeTopicId=null;document.getElementById('question').value='';document.getElementById('result').classList.add('hidden');document.getElementById('status').classList.add('hidden')}
function renderResult(d){lastAI=d;const topic=d.topic_action==='existing'?`<div class="notice"><b>既存テーマに紐付けます</b><br>「${esc((topics.find(t=>t.id===d.topic_id)||{}).title||d.topic_title||d.topic_id||'既存テーマ')}」</div>`:`<div class="notice"><b>新しいテーマ</b><br>「${esc(d.topic_title||'新しいテーマ')}」として整理します。</div>`;document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML='<b>相談結果</b><div class="answer">'+esc(d.answer||'')+'</div>'+(d.account_candidates?.length?'<div style="margin-top:14px"><b>勘定科目候補</b>'+d.account_candidates.map(x=>`<div class="q"><b>${esc(x.name)}</b><div class="small muted">${esc(x.reason||'')}</div></div>`).join('')+'</div>':'')+(d.tax_category_candidates?.length?'<div style="margin-top:14px"><b>課税区分候補</b><div>'+d.tax_category_candidates.map(x=>`<span class="chip">${esc(x.name)}</span>`).join('')+'</div></div>':'')+(d.caution?`<div class="notice"><b>注意：</b>${esc(d.caution)}</div>`:'')+topic+'<div class="actions"><button class="primary" onclick="saveAI()">この相談を保存</button><button class="light" onclick="newConsult()">新しい相談</button></div>'}
async function askAI(){const q=document.getElementById('question').value.trim();if(!q)return setStatus('質問を入力してください。',true);document.getElementById('ask').disabled=true;setStatus('AIに相談中…');try{const {data,error}=await sb.functions.invoke('accounting-consult-ai-fast',{body:{question:q,topic_id:activeTopicId||null}});if(error)throw error;renderResult(data);setStatus('回答が返りました。内容を確認して保存してください。')}catch(e){setStatus('AI相談に失敗しました：'+esc(e.message||e),true)}finally{document.getElementById('ask').disabled=false}}
async function saveAI(){if(!lastAI)return;const q=document.getElementById('question').value.trim();try{let tid=lastAI.topic_action==='existing'?lastAI.topic_id:null;if(!tid){const title=(lastAI.topic_title||q).slice(0,80);const {data,error}=await sb.from('accounting_topics').insert({user_id:user.id,title,summary:(lastAI.answer||'').slice(0,160)}).select().single();if(error)throw error;tid=data.id}else if(!topics.some(t=>t.id===tid)){throw new Error('既存テーマを確認できませんでした。もう一度AI相談してください。')}const {data:c,error:ce}=await sb.from('accounting_consultations').insert({user_id:user.id,question:q,ai_answer:lastAI.answer||'',ai_caution:lastAI.caution||null,ai_model:lastAI.model||null,consultation_type:lastAI.consultation_type||null,ai_tax_category_candidates:lastAI.tax_category_candidates||[],topic_id:tid}).select().single();if(ce)throw ce;for(const x of lastAI.account_candidates||[]){const {data:a,error:ae}=await sb.from('accounting_accounts').upsert({user_id:user.id,name:x.name,archived:false},{onConflict:'user_id,name'}).select().single();if(!ae&&a)await sb.from('accounting_consultation_accounts').upsert({user_id:user.id,consultation_id:c.id,account_id:a.id},{onConflict:'consultation_id,account_id'})}activeTopicId=tid;setStatus('保存しました。過去の相談でテーマとして確認できます。');await load();}catch(e){setStatus('保存に失敗しました：'+esc(e.message||e),true)}}
async function manualSave(){const q=document.getElementById('question').value.trim();if(!q)return setStatus('相談内容を入力してください。',true);try{let tid=activeTopicId;if(!tid){const {data,error}=await sb.from('accounting_topics').insert({user_id:user.id,title:q.slice(0,80),summary:'手動保存'}).select().single();if(error)throw error;tid=data.id}const {error}=await sb.from('accounting_consultations').insert({user_id:user.id,question:q,ai_answer:null,topic_id:tid});if(error)throw error;activeTopicId=tid;setStatus('保存しました。');await load()}catch(e){setStatus('保存に失敗しました：'+esc(e.message||e),true)}}
boot();
</script>
</body>
</html>
