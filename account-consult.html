<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勘定科目相談 | 資格勉強OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#080c17;--card:#12182a;--text:#f5f7ff;--muted:#98a3bf;--accent:#8b5cf6;--line:#26314d;--good:#34d399;--danger:#fb7185}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:980px;margin:auto;padding:18px 18px 90px;background:radial-gradient(circle at top left,#1a1640 0,#090e1a 42%,#050812 100%);color:var(--text)}h1,h2,h3{margin:0}.muted{color:var(--muted)}.small{font-size:13px}.card{background:linear-gradient(145deg,rgba(18,24,42,.96),rgba(10,15,28,.98));border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 15px 45px rgba(0,0,0,.22)}button{border:0;border-radius:11px;padding:10px 15px;font-weight:850;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:#fff}.light{background:#222b43;color:#e8ecff;border:1px solid #33405f}.danger{background:#3d1725;color:#ffc1cf;border:1px solid #6b2941}button:disabled{opacity:.5;cursor:not-allowed}input{width:100%;padding:13px;border:1px solid #394563;border-radius:12px;background:#0c1322;color:#f4f6ff;font-size:16px;min-height:48px}.top,.consult-head,.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{margin-top:14px;padding:12px 14px;border-radius:13px;background:#151d32;border:1px solid #33405f;color:#cbd4ea}.notice.error{border-color:#6b2941;color:#ffc1cf}.hidden{display:none!important}.tabs{position:sticky;top:10px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px;padding:7px;background:rgba(8,12,23,.88);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}.tab{background:#11182a;color:#aeb8d3;border:1px solid #2b3550}.tab.active{background:linear-gradient(145deg,#30205f,#21183e);color:#fff;border-color:#7257c8}.ai{margin-top:16px;padding:16px;border:1px solid #4a3d78;border-radius:16px;background:linear-gradient(145deg,#15132a,#0c1220)}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c7b8ff;font-weight:900;margin-bottom:6px}.answer{white-space:pre-wrap;line-height:1.75}.candidate{padding:11px 0;border-bottom:1px solid #2b3450}.candidate:last-child{border-bottom:0}.chip{display:inline-block;background:#17243a;border:1px solid #334b72;border-radius:999px;padding:4px 9px;font-size:12px;margin:3px 4px 0 0}.topic-card{border:1px solid #33405f;border-radius:16px;padding:15px;background:#0f1627;margin-top:10px}.topic-card:hover{border-color:#53638f}.q{margin-top:10px;padding:12px;border-radius:12px;background:#0c1322;border:1px solid #26314d}.q b{display:block}.box-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{border:1px solid #33405f;border-radius:15px;padding:15px;background:#0f1627;cursor:pointer}.box strong{display:block;font-size:17px;margin-bottom:6px}.empty{text-align:center;padding:34px 16px;border:1px dashed #33405f;border-radius:15px;color:var(--muted)}
@media(max-width:700px){body{padding:12px}.box-grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.tabs{top:6px}}@media(max-width:430px){.box-grid{grid-template-columns:1fr}}
</style></head><body>
<div id="auth" class="card hidden"><h2>🧾 勘定科目相談</h2><p class="muted">資格OSと同じアカウントでログインしてください。</p><button class="primary" onclick="login()">Googleでログイン</button><p id="authErr" class="small"></p></div>
<div id="app" class="hidden"><header class="top"><div><div class="small muted">ACCOUNTING CONSULT</div><h1>🧾 勘定科目相談</h1><div class="muted small">自分専用の相談・知識カード</div></div><div class="actions"><button class="light" onclick="location.href='index.html'">← 資格OS</button><button class="light" onclick="logout()">ログアウト</button></div></header>
<nav class="tabs"><button id="t-consult" class="tab active" onclick="tab('consult')">相談する</button><button id="t-history" class="tab" onclick="tab('history')">過去の相談</button><button id="t-box" class="tab" onclick="tab('box')">勘定科目BOX</button></nav>
<section id="p-consult"><div class="card"><div class="consult-head"><div><div class="small muted">NEW CONSULTATION</div><h2>新しく相談する</h2><p class="muted">AIが既存テーマとの関連も判定して、同じテーマにまとめます。</p></div><div style="font-size:42px">💬</div></div><label>何について困っていますか？</label><input id="question" maxlength="300" placeholder="例：会費、商店街の会費、SDカード、駐車場代"><div class="actions"><button id="aiBtn" class="primary" onclick="askAI()">🤖 AIに相談する</button><button class="light" onclick="manualSave()">相談だけ保存</button></div><div id="status" class="notice hidden"></div><div id="result" class="ai hidden"></div></div></section>
<section id="p-history" class="hidden"><div class="card"><div class="row"><div><div class="small muted">KNOWLEDGE TOPICS</div><h2>相談テーマ</h2></div><span id="topicCount" class="chip">0件</span></div><div class="toolbar"><input id="search" placeholder="テーマ・相談内容を検索" oninput="renderHistory()"></div><div id="history"></div></div></section>
<section id="p-box" class="hidden"><div class="card"><div class="small muted">ACCOUNT TITLE BOX</div><h2>勘定科目BOX</h2><div id="boxes" class="box-grid" style="margin-top:12px"></div><div id="boxDetail"></div></div></section></div>
<script>
const URL='https://txprypfzdsfaupguhybl.supabase.co';const KEY='sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,topics=[],consultations=[],accounts=[],relations=[],activeTopicId=null;
const DEFAULTS=[['消耗品費',10],['通信費',20],['車両費',30],['広告宣伝費',40],['旅費交通費',50],['租税公課',60]];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=s=>{const d=new Date(s);return isNaN(d)?'—':d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
function status(m,e=false){const x=document.getElementById('status');x.classList.remove('hidden','error');x.classList.toggle('error',e);x.innerHTML=m}function clearStatus(){document.getElementById('status').classList.add('hidden')}
async function login(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)document.getElementById('authErr').textContent=error.message}async function logout(){await sb.auth.signOut()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('auth').classList.remove('hidden');return}user=session.user;document.getElementById('app').classList.remove('hidden');await ensureAccounts();await load();}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')location.reload();if(e==='SIGNED_IN'&&s)boot()});
async function ensureAccounts(){const rows=DEFAULTS.map(([name,sort_order])=>({user_id:user.id,name,sort_order,archived:false}));const {error}=await sb.from('accounting_accounts').upsert(rows,{onConflict:'user_id,name'});if(error)console.warn(error)}
async function load(){const [t,c,a,r]=await Promise.all([sb.from('accounting_topics').select('*').eq('user_id',user.id).order('updated_at',{ascending:false}),sb.from('accounting_consultations').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('accounting_accounts').select('*').eq('user_id',user.id).eq('archived',false).order('sort_order').order('name'),sb.from('accounting_consultation_accounts').select('*').eq('user_id',user.id)]);for(const z of [t,c,a,r])if(z.error)throw z.error;topics=t.data||[];consultations=c.data||[];accounts=a.data||[];relations=r.data||[];renderAll()}
function renderAll(){renderHistory();renderBoxes()}
function tab(n){['consult','history','box'].forEach(x=>{document.getElementById('p-'+x).classList.toggle('hidden',x!==n);document.getElementById('t-'+x).classList.toggle('active',x===n)});if(n==='history')renderHistory();if(n==='box')renderBoxes()}
function renderHistory(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase();const rows=topics.filter(t=>{if(!q)return true;return (t.title+' '+(t.summary||'')+' '+consultations.filter(c=>c.topic_id===t.id).map(c=>c.question+' '+(c.ai_answer||'')).join(' ')).toLowerCase().includes(q)});document.getElementById('topicCount').textContent=rows.length+'件';if(!rows.length){document.getElementById('history').innerHTML='<div class="empty">まだテーマがありません。</div>';return}document.getElementById('history').innerHTML=rows.map(renderTopic).join('')}
function renderTopic(t){const cs=consultations.filter(c=>c.topic_id===t.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return `<article class="topic-card"><div class="row"><div><div class="small muted">テーマ</div><h3>${esc(t.title)}</h3><div class="muted small">${cs.length}件の相談 ・ 更新 ${fmt(t.updated_at)}</div></div><button class="primary" onclick="openTopic('${t.id}')">このテーマで相談</button></div>${t.summary?`<p class="muted small">${esc(t.summary)}</p>`:''}<div>${cs.slice(-6).map(c=>`<div class="q"><b>${esc(c.question)}</b><div class="muted small" style="margin-top:4px">${fmt(c.created_at)}</div><div style="margin-top:8px;white-space:pre-wrap">${esc(c.ai_answer||'相談のみ保存')}</div></div>`).join('')}</div></article>`}
function openTopic(id){activeTopicId=id;tab('consult');const t=topics.find(x=>x.id===id);document.getElementById('question').placeholder='「'+(t?.title||'このテーマ')+'」について追加で質問';document.getElementById('question').focus();status('現在のテーマ：<b>'+esc(t?.title||'')+'</b>　このまま追加質問できます。')}
function renderBoxes(){const counts={};relations.forEach(r=>counts[r.account_id]=(counts[r.account_id]||0)+1);document.getElementById('boxes').innerHTML=accounts.map(a=>`<div class="box" onclick="showBox('${a.id}')"><strong>${esc(a.name)}</strong><span class="muted small">相談 ${counts[a.id]||0}件</span></div>`).join('')}
function showBox(id){const a=accounts.find(x=>x.id===id);const cs=consultations.filter(c=>relations.some(r=>r.account_id===id&&r.consultation_id===c.id));document.getElementById('boxDetail').innerHTML=`<div class="topic-card"><div class="row"><h3>${esc(a?.name||'')}</h3><button class="light" onclick="document.getElementById('boxDetail').innerHTML=''">閉じる</button></div>${cs.length?cs.map(c=>`<div class="q"><b>${esc(c.question)}</b><div class="muted small">${fmt(c.created_at)}</div></div>`).join(''):'<div class="empty">紐付いた相談はありません。</div>'}</div>`}
function renderResult(d){const el=document.getElementById('result');el.classList.remove('hidden');const cs=(d.account_candidates||[]).map(x=>`<div class="candidate"><b>${esc(x.name)}</b><div class="muted small">${esc(x.reason||'')}</div></div>`).join('');const tx=(d.tax_category_candidates||[]).map(x=>`<span class="chip">${esc(x.name)}</span>`).join('');let topic='';if(d.topic_action==='existing'&&d.topic_id){const t=topics.find(x=>x.id===d.topic_id);topic=`<div class="notice"><b>既存テーマに紐付けます</b><br>「${esc(t?.title||d.topic_id)}」</div>`}else{topic=`<div class="notice"><b>新しいテーマ</b><br>「${esc(d.topic_title||'新しいテーマ')}」として整理します。</div>`}el.innerHTML=`<div class="label">相談結果</div><div class="answer">${esc(d.answer||'')}</div>${cs?`<div style="margin-top:16px"><div class="label">勘定科目候補</div>${cs}</div>`:''}${tx?`<div style="margin-top:14px"><div class="label">課税区分候補</div>${tx}</div>`:''}${d.caution?`<div class="notice"><b>注意事項：</b>${esc(d.caution)}</div>`:''}${topic}<div class="actions"><button class="primary" onclick="continueTopic()">このテーマについて追加で聞く</button><button class="light" onclick="newConsult()">新しい相談をする</button></div>`}
function newConsult(){activeTopicId=null;document.getElementById('question').value='';document.getElementById('question').placeholder='例：会費、商店街の会費、SDカード';document.getElementById('result').classList.add('hidden');clearStatus();document.getElementById('question').focus()}
function continueTopic(){if(activeTopicId)openTopic(activeTopicId);else if(window._lastAI?.topic_id&&window._lastAI.topic_action==='existing')openTopic(window._lastAI.topic_id)}
async function createTopic(title,summary){const {data,error}=await sb.from('accounting_topics').insert({user_id:user.id,title:title||'未整理の相談',summary:summary||null}).select().single();if(error)throw error;topics=[data,...topics];return data}
async function saveAI(question,d){let topic=null;if(d.topic_action==='existing'&&d.topic_id)topic=topics.find(t=>t.id===d.topic_id)||null;if(!topic)topic=await createTopic(d.topic_title||question.slice(0,40),d.answer?.slice(0,160));const {data:c,error}=await sb.from('accounting_consultations').insert({user_id:user.id,question,ai_answer:d.answer||null,ai_caution:d.caution||null,ai_model:d.model||null,consultation_type:d.consultation_type||'accounting',ai_tax_category_candidates:Array.isArray(d.tax_category_candidates)?d.tax_category_candidates:[],topic_id:topic.id}).select().single();if(error)throw error;consultations=[c,...consultations];const candidates=Array.isArray(d.account_candidates)?d.account_candidates:[];for(const x of candidates.slice(0,3)){const name=String(x.name||'').trim();if(!name)continue;let acc=accounts.find(a=>a.name===name);if(!acc){const r=await sb.from('accounting_accounts').upsert({user_id:user.id,name,sort_order:1000,archived:false},{onConflict:'user_id,name'}).select().single();if(!r.error)acc=r.data}if(acc){const rr=await sb.from('accounting_consultation_accounts').insert({user_id:user.id,consultation_id:c.id,account_id:acc.id,relation_type:'candidate',reason:String(x.reason||'').slice(0,600)}).select().single();if(!rr.error)relations.push(rr.data);accounts=[...accounts.filter(a=>a.id!==acc.id),acc]}}activeTopicId=topic.id;const idx=topics.findIndex(t=>t.id===topic.id);if(idx>=0){topics[idx]={...topics[idx],updated_at:new Date().toISOString()};topics.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))}renderAll();return topic}
async function askAI(){const q=document.getElementById('question').value.trim();if(!q){status('相談内容を入力してください。',true);return}const btn=document.getElementById('aiBtn');btn.disabled=true;btn.textContent='🤖 AIに相談中…';clearStatus();window._lastAI=null;try{const {data,error}=await sb.functions.invoke('accounting-consult-ai-fast',{body:{question:q,topic_id:activeTopicId||null}});if(error)throw error;if(!data||data.error)throw new Error(data?.error||'AI回答を取得できませんでした。');window._lastAI=data;renderResult(data);status('AI回答を取得しました。保存しています…');const topic=await saveAI(q,data);document.getElementById('question').value='';document.getElementById('question').placeholder='「'+topic.title+'」について追加で質問';status('保存しました。現在のテーマ：<b>'+esc(topic.title)+'</b>');}catch(e){console.error(e);status('AI回答は取得できましたが、保存またはAI処理に失敗しました：'+esc(e.message||e),true)}finally{btn.disabled=false;btn.textContent='🤖 AIに相談する'}}
async function manualSave(){const q=document.getElementById('question').value.trim();if(!q){status('相談内容を入力してください。',true);return}try{const topic=activeTopicId?topics.find(t=>t.id===activeTopicId):null;const t=topic||await createTopic(q.slice(0,40),null);const {data:c,error}=await sb.from('accounting_consultations').insert({user_id:user.id,question:q,topic_id:t.id,consultation_type:'general'}).select().single();if(error)throw error;consultations=[c,...consultations];activeTopicId=t.id;document.getElementById('question').value='';renderAll();status('相談を保存しました。テーマ：「'+esc(t.title)+'」')}catch(e){status('保存に失敗しました：'+esc(e.message),true)}}
boot().catch(e=>{console.error(e);document.getElementById('auth').classList.remove('hidden');document.getElementById('authErr').textContent=e.message});
</script></body></html>
