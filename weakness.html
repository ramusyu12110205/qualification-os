<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弱点分析｜資格OS</title>
<style>
:root{--bg:#080c17;--card:#12182a;--text:#f5f7ff;--muted:#98a3bf;--accent:#8b5cf6;--good:#34d399;--bad:#fb7185;--line:#26314d}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1400px;margin:auto;padding:18px 24px 80px;background:radial-gradient(circle at top left,#1a1640 0,#090e1a 42%,#050812 100%);color:var(--text)}
h1{margin:0;font-size:30px}.muted{color:var(--muted)}.small{font-size:13px}.card{background:linear-gradient(145deg,rgba(18,24,42,.96),rgba(10,15,28,.98));border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0f1627;border:1px solid var(--line);border-radius:15px;padding:14px}.stat b{display:block;color:#aeb8d2;font-size:12px}.stat strong{font-size:26px}select{width:100%;padding:11px;border:1px solid #394563;border-radius:11px;background:#0c1322;color:#f4f6ff;font-size:16px;min-height:44px}button{border:0;border-radius:11px;padding:10px 15px;font-weight:850;cursor:pointer;min-height:42px}.light{background:#222b43;color:#e8ecff;border:1px solid #33405f}.primary{background:var(--accent);color:#fff}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#261b50;color:#d7ceff;border:1px solid #45337c}.problem{border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0;background:#0f1627;cursor:pointer}.problem:hover{border-color:#53638f}.problem-main{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:15px;align-items:center}.num{font-weight:900}.bad{color:var(--bad)}.good{color:var(--good)}.detail{margin-top:12px;padding:13px;border-left:2px solid #45337c;background:#0b1220;border-radius:8px}.timeline{display:flex;gap:8px;flex-wrap:wrap}.event{padding:7px 9px;border-radius:9px;background:#18223a;border:1px solid #2d3956;font-size:12px}.event.wrong{border-color:#6b2941;color:#ffc1cf}.event.correct{border-color:#27614f;color:#b7f7df}.auth{text-align:center;padding:80px 20px}.hidden{display:none}.weakness-level{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;border:1px solid}.weakness-level.level5{background:#3d1725;color:#ffc1cf;border-color:#6b2941}.weakness-level.level4{background:#3b2415;color:#ffd0a3;border-color:#79502e}.weakness-level.level3{background:#332b13;color:#f7df8b;border-color:#665a28}.weakness-level.level2{background:#1d2b27;color:#b7f7df;border-color:#27614f}.weakness-level.level1{background:#18223a;color:#b8c6e8;border-color:#344566}.weakness-meter{display:flex;gap:3px;margin-top:7px}.weakness-meter i{display:block;width:22px;height:5px;border-radius:99px;background:#26314d}.weakness-meter i.on{background:#fb7185}.priority-note{font-size:11px;color:#aeb8d2;margin-top:5px}@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.problem-main{grid-template-columns:1fr 1fr}.problem-main>:first-child{grid-column:1/-1}}@media(max-width:500px){.grid{grid-template-columns:1fr}.problem-main{grid-template-columns:1fr 1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="auth" class="auth hidden"><h2>ログインしてください</h2><p class="muted">資格OSにログインした状態で開いてください。</p><a href="index.html">資格OSへ戻る</a></div>
<div id="app" class="hidden">
  <div class="row" style="justify-content:space-between"><div><div class="muted small">資格OS / ANALYSIS</div><h1>弱点分析</h1><p class="muted" style="margin:5px 0 0">誤答履歴から「何度も間違えている問題」を見つけます。</p></div><a href="index.html"><button class="light">← 資格OSへ戻る</button></a></div>
  <section class="grid" style="margin-top:16px">
    <div class="stat"><b>対象問題</b><strong id="totalProblems">—</strong></div><div class="stat"><b>誤答経験あり</b><strong id="wrongProblems">—</strong></div><div class="stat"><b>総誤答</b><strong id="wrongTotal">—</strong></div><div class="stat"><b>3回以上誤答</b><strong id="weakProblems">—</strong></div>
  </section>
  <section class="card">
    <div class="row" style="align-items:end">
      <div style="flex:1;min-width:180px"><label>科目</label><select id="subjectFilter" onchange="render()"><option value="all">すべての科目</option></select></div>
      <div style="flex:1;min-width:180px"><label>誤答回数</label><select id="wrongFilter" onchange="render()"><option value="0">すべて</option><option value="1">1回以上</option><option value="2">2回以上</option><option value="3" selected>3回以上</option><option value="5">5回以上</option></select></div>
      <div style="flex:1;min-width:180px"><label>並び順</label><select id="sortMode" onchange="render()"><option value="wrong">誤答回数が多い順</option><option value="accuracy">正答率が低い順</option><option value="recent">最終誤答が新しい順</option><option value="attempts">回答回数が多い順</option></select></div>
    </div>
  </section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2>弱点候補</h2><span id="resultCount" class="badge"></span></div><p class="muted small">問題を押すと、誤答・正答の履歴を時系列で確認できます。</p><div id="list"></div></section>
</div>
<div id="toast"></div>
<script>
const SUPABASE_URL='https://txprypfzdsfaupguhybl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,problems=[],subjects=[],history=[],openId=null;
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
function fmtDateTime(s){if(!s)return '—';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function weaknessLevel(wrong){if(wrong>=5)return 5;if(wrong>=4)return 4;if(wrong>=3)return 3;if(wrong>=2)return 2;if(wrong>=1)return 1;return 0}
function weaknessLabel(level){return ['—','軽度','注意','弱点','強い弱点','最重要'][level]}
function weaknessBadge(wrong){const level=weaknessLevel(wrong);if(!level)return '';return `<span class="weakness-level level${level}">${weaknessLabel(level)}・誤答${wrong}回</span>`}
function weaknessMeter(wrong){const level=weaknessLevel(wrong);if(!level)return '';return `<div class="weakness-meter">${[1,2,3,4,5].map(i=>`<i class="${i<=level?'on':''}"></i>`).join('')}</div>`}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('auth').classList.remove('hidden');return}await boot(session.user);sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')location.href='index.html'});}
async function boot(u){user=u;document.getElementById('app').classList.remove('hidden');
 const [p,s,h]=await Promise.all([
  sb.from('problems').select('id,name,subject_id,stage,status,attempts,last_result').eq('user_id',u.id).order('name'),
  sb.from('subjects').select('id,name,qualification_id,sort_order').eq('user_id',u.id).order('sort_order').order('name'),
  sb.from('problem_review_history').select('problem_id,review_date,result,source,created_at').eq('user_id',u.id).order('review_date',{ascending:true}).order('created_at',{ascending:true})
 ]);
 if(p.error||s.error||h.error){alert('弱点データの取得に失敗しました');console.error(p.error||s.error||h.error);return}
 problems=p.data||[];subjects=s.data||[];history=h.data||[];
 const sf=document.getElementById('subjectFilter');subjects.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sf.appendChild(o)});render();}
function statsFor(p){const hs=history.filter(h=>h.problem_id===p.id);const wrong=hs.filter(h=>h.result==='wrong');const correct=hs.filter(h=>h.result==='correct');const total=hs.length;return {hs,wrong,correct,total,accuracy:total?correct.length/total*100:0,firstWrong:wrong[0]?.review_date||null,lastWrong:wrong.at(-1)?.review_date||null,last:hs.at(-1)||null}}
function render(){const sid=document.getElementById('subjectFilter').value;const min=Number(document.getElementById('wrongFilter').value);const mode=document.getElementById('sortMode').value;
 const rows=problems.map(p=>({p,...statsFor(p)})).filter(x=>(sid==='all'||x.p.subject_id===sid)&&x.wrong.length>=min);
 rows.sort((a,b)=>mode==='wrong'?b.wrong.length-a.wrong.length||b.total-a.total:mode==='accuracy'?a.accuracy-b.accuracy||b.wrong.length-a.wrong.length:mode==='recent'?String(b.lastWrong||'').localeCompare(String(a.lastWrong||'')):b.total-a.total||b.wrong.length-a.wrong.length);
 document.getElementById('totalProblems').textContent=problems.length+'問';document.getElementById('wrongProblems').textContent=problems.filter(p=>statsFor(p).wrong.length>0).length+'問';document.getElementById('wrongTotal').textContent=history.filter(h=>h.result==='wrong').length+'回';document.getElementById('weakProblems').textContent=problems.filter(p=>statsFor(p).wrong.length>=3).length+'問';document.getElementById('resultCount').textContent=rows.length+'問';
 const list=document.getElementById('list');if(!rows.length){list.innerHTML='<div class="problem">条件に該当する問題はありません。</div>';return}
 list.innerHTML=rows.map(x=>{const sub=subjects.find(s=>s.id===x.p.subject_id);const open=openId===x.p.id;return `<div class="problem" onclick="toggle('${x.p.id}')"><div class="problem-main"><div><span class="num">${esc(x.p.name)}</span> <span class="badge">${esc(sub?.name||'科目不明')}</span><div style="margin-top:6px">${weaknessBadge(x.wrong.length)}</div><div class="muted small" style="margin-top:5px">${x.total}回回答 ・ 最終結果 ${x.last?.result==='wrong'?'誤答':x.last?.result==='correct'?'正答':'—'}</div>${weaknessMeter(x.wrong.length)}</div><div><span class="bad">誤答 ${x.wrong.length}回</span></div><div><span class="good">正答 ${x.correct.length}回</span></div><div>正答率 <b>${x.accuracy.toFixed(0)}%</b></div></div>${open?detailHtml(x):''}</div>`}).join('');}
function detailHtml(x){return `<div class="detail" onclick="event.stopPropagation()"><div class="row"><span>${weaknessBadge(x.wrong.length)}</span><span>初回誤答: <b>${fmtDate(x.firstWrong)}</b></span><span>最終誤答: <b>${fmtDate(x.lastWrong)}</b></span><span>現在: <b>${x.p.status==='mastered'?'MASTER':x.p.last_result==='wrong'?'再復習':'通常'}</b></span></div><div class="priority-note">弱点度は誤答回数を基準にした目安です。復習状態そのものは既存の判定を使用しています。</div><div class="timeline" style="margin-top:10px">${x.hs.map(h=>`<span class="event ${h.result==='wrong'?'wrong':'correct'}">${h.result==='wrong'?'×':'○'} ${fmtDateTime(h.created_at)} <small>(${fmtDate(h.review_date)})</small></span>`).join('')}</div></div>`}
function toggle(id){openId=openId===id?null:id;render()}
init();
</script>
</body>
</html>
