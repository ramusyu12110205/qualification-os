<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勉強履歴｜資格OS</title>
<style>
:root{--bg:#080c17;--card:#12182a;--text:#f5f7ff;--muted:#98a3bf;--accent:#8b5cf6;--good:#34d399;--bad:#fb7185;--line:#26314d}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:18px 20px 70px;background:radial-gradient(circle at top left,#1a1640 0,#090e1a 42%,#050812 100%);color:var(--text)}
h1{margin:0;font-size:28px}.muted{color:var(--muted)}.small{font-size:12px}.card{background:linear-gradient(145deg,rgba(18,24,42,.96),rgba(10,15,28,.98));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0f1627;border:1px solid var(--line);border-radius:13px;padding:11px}.stat b{display:block;font-size:11px;color:#aeb8d2}.stat strong{font-size:21px}select{width:100%;padding:9px;border:1px solid #394563;border-radius:10px;background:#0c1322;color:#f4f6ff;font-size:15px;min-height:40px}.history-item{border:1px solid var(--line);border-radius:13px;background:#0f1627;margin:7px 0;overflow:hidden}.history-summary{display:grid;grid-template-columns:80px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 13px;cursor:pointer}.history-summary:hover{background:#141d31}.date{font-weight:900}.type{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;background:#261b50;color:#d7ceff;border:1px solid #45337c}.minutes{font-weight:900;white-space:nowrap}.detail{padding:0 13px 12px;border-top:1px solid var(--line)}.problem-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.problem{font-size:12px;padding:4px 8px;border-radius:8px;background:#18223a;border:1px solid #2d3956}.problem.wrong{border-color:#6b2941;color:#ffc1cf}.problem.correct{border-color:#27614f;color:#b7f7df}.memo{margin-top:8px;padding:8px 10px;border-radius:9px;background:#0b1220;color:#cbd4eb;font-size:12px}.empty{padding:25px;text-align:center}.auth{text-align:center;padding:80px 20px}button{border:0;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.light{background:#222b43;color:#e8ecff;border:1px solid #33405f}.hidden{display:none}@media(max-width:650px){body{padding:12px}.statgrid{grid-template-columns:1fr 1fr}.history-summary{grid-template-columns:65px minmax(0,1fr) auto}.history-summary .minutes{grid-column:3}.history-summary .type{grid-column:2;justify-self:start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="auth" class="auth hidden"><h2>ログインしてください</h2><p class="muted">資格OSにログインした状態で開いてください。</p><a href="index.html">資格OSへ戻る</a></div>
<div id="app" class="hidden">
  <div class="row" style="justify-content:space-between"><div><div class="muted small">資格OS / STUDY HISTORY</div><h1>勉強履歴</h1><div class="muted small">何を・いつ・どれくらいやったかを確認できます。</div></div><a href="index.html"><button class="light">← 資格OSへ戻る</button></a></div>
  <section class="statgrid" style="margin-top:14px"><div class="stat"><b>記録件数</b><strong id="count">0件</strong></div><div class="stat"><b>総勉強時間</b><strong id="total">0時間0分</strong></div><div class="stat"><b>表示中</b><strong id="shown">0件</strong></div></section>
  <section class="card"><div class="row"><div style="flex:1;min-width:180px"><label class="small">資格</label><select id="qualificationFilter" onchange="render()"><option value="all">すべて</option></select></div><div style="flex:1;min-width:180px"><label class="small">内容</label><select id="typeFilter" onchange="render()"><option value="all">すべて</option><option value="new_problems">新規問題</option><option value="review">復習</option><option value="textbook">テキスト</option><option value="lecture">講義</option><option value="mock">模試</option><option value="other">その他</option></select></div></div></section>
  <section class="card"><div id="list"></div></section>
</div>
<script>
const SUPABASE_URL='https://txprypfzdsfaupguhybl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,qualifications=[],subjects=[],sessions=[],links=[],problems=[];
const labels={new_problems:'新規問題',review:'復習',textbook:'テキスト',lecture:'講義',mock:'模試',other:'その他'};
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
function minutesText(m){m=Number(m)||0;return `${Math.floor(m/60)}時間${m%60}分`}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('auth').classList.remove('hidden');return}await boot(session.user);sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_OUT')location.href='index.html'});}
async function boot(u){user=u;document.getElementById('app').classList.remove('hidden');
 const [q,s,st,l,p]=await Promise.all([
  sb.from('qualifications').select('id,name').eq('user_id',u.id).eq('archived',false).order('sort_order').order('name'),
  sb.from('subjects').select('id,name,qualification_id').eq('user_id',u.id).eq('archived',false).order('sort_order').order('name'),
  sb.from('study_sessions').select('id,qualification_id,subject_id,study_date,activity_type,minutes,memo,created_at').eq('user_id',u.id).order('study_date',{ascending:false}).order('created_at',{ascending:false}),
  sb.from('study_session_problems').select('session_id,problem_id,role,result').eq('user_id',u.id),
  sb.from('problems').select('id,name,subject_id').eq('user_id',u.id)
 ]);
 const err=q.error||s.error||st.error||l.error||p.error;if(err){alert('勉強履歴の取得に失敗しました');console.error(err);return}
 qualifications=q.data||[];subjects=s.data||[];sessions=st.data||[];links=l.data||[];problems=p.data||[];
 const sel=document.getElementById('qualificationFilter');qualifications.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sel.appendChild(o)});render();}
function render(){const qid=document.getElementById('qualificationFilter').value,type=document.getElementById('typeFilter').value;const rows=sessions.filter(s=>(qid==='all'||s.qualification_id===qid)&&(type==='all'||s.activity_type===type));
 document.getElementById('count').textContent=sessions.length+'件';document.getElementById('total').textContent=minutesText(sessions.reduce((a,s)=>a+Number(s.minutes||0),0));document.getElementById('shown').textContent=rows.length+'件';
 const list=document.getElementById('list');if(!rows.length){list.innerHTML='<div class="empty muted">勉強記録はありません。</div>';return}
 list.innerHTML=rows.map((s,i)=>{const q=qualifications.find(x=>x.id===s.qualification_id),sub=subjects.find(x=>x.id===s.subject_id);const ls=links.filter(x=>x.session_id===s.id);const open=i<1;return `<details class="history-item" ${open?'open':''}><summary class="history-summary"><span class="date">${fmtDate(s.study_date)}</span><span><b>${esc(q?.name||'資格')}</b>${sub?` / ${esc(sub.name)}`:''}<br><span class="type">${esc(labels[s.activity_type]||s.activity_type)}</span></span><span class="minutes">${minutesText(s.minutes)}</span><span class="muted">⌄</span></summary><div class="detail">${detailHtml(s,ls)}</div></details>`}).join('');}
function detailHtml(s,ls){let out='';if(s.memo)out+=`<div class="memo">💬 ${esc(s.memo)}</div>`;if(ls.length){out+=`<div class="muted small" style="margin-top:9px">実施した問題 ${ls.length}問</div><div class="problem-list">${ls.map(l=>{const p=problems.find(x=>x.id===l.problem_id);return `<span class="problem ${l.result==='wrong'?'wrong':l.result==='correct'?'correct':''}">${l.result==='wrong'?'× ':l.result==='correct'?'○ ':''}${esc(p?.name||'問題')}</span>`}).join('')}</div>`}else if(s.activity_type==='new_problems'||s.activity_type==='review'){out+='<div class="muted small" style="margin-top:9px">問題の詳細はありません。</div>'}else{out+='<div class="muted small" style="margin-top:9px">この記録は時間のみの学習記録です。</div>'}return out}
init();
</script>
</body>
</html>
