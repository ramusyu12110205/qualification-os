name: Apply retro review state fix
on:
  push:
    paths:
      - .github/workflows/apply-retro-review-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = "function getRetroProblemNames(){"
          if "function syncRetroReviewStateFromDOM()" not in s:
              insert = '''function syncRetroReviewStateFromDOM(){\n  document.querySelectorAll('#retroReviewPanel select[data-retro-row][data-retro-problem]').forEach(el=>{\n    const rowIndex=Number(el.dataset.retroRow);\n    const problemName=el.dataset.retroProblem;\n    if(!Number.isInteger(rowIndex)||!problemName||!retroReviewRows[rowIndex])return;\n    retroReviewRows[rowIndex].results ||= {};\n    retroReviewRows[rowIndex].results[problemName]=el.value;\n  });\n}\n\n'''
              s = s.replace(marker, insert + marker, 1)

          s = s.replace("function addRetroReviewRow(defaultDate=''){\n  const studyDate=", "function addRetroReviewRow(defaultDate=''){\n  syncRetroReviewStateFromDOM();\n  const studyDate=", 1)
          s = s.replace("function removeRetroReviewRow(index){\n", "function removeRetroReviewRow(index){\n  syncRetroReviewStateFromDOM();\n", 1)
          s = s.replace("async function saveRetroReviewHistory(problemMap){\n", "async function saveRetroReviewHistory(problemMap){\n  syncRetroReviewStateFromDOM();\n", 1)

          old = '<select onchange="updateRetroReviewResult(${i},${JSON.stringify(n)},this.value)">'
          new = '<select data-retro-row="${i}" data-retro-problem="${n.replace(/\\"/g,\'&quot;\')}" onchange="updateRetroReviewResult(${i},${JSON.stringify(n)},this.value)">'
          if old not in s:
              raise SystemExit('expected select template not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify patch
        run: |
          grep -n "syncRetroReviewStateFromDOM\|data-retro-row" index.html
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-retro-review-fix.yml
          git commit -m "fix: preserve retro review results before rerender"
          git push
