name: Add flashcard entry
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/add-flashcard-entry.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add flashcard button once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "onclick=\"location.href='flashcards.html'\""
          if marker in s:
              print('Flashcard entry already present')
              raise SystemExit(0)
          old = '<button class="light" onclick="logout()">ログアウト</button>'
          new = '<button class="primary" onclick="location.href=\'flashcards.html\'">🧠 暗記カード</button>\n    ' + old
          if old not in s:
              raise SystemExit('Target logout button not found; aborting without changes')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Add flashcard entry to qualification OS'
          git push
