name: fix-passed-subjects
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qualification-subject-tabs.js')
          s=p.read_text()
          marker='// hide passed subjects in the new-problem subject selector'
          i=s.find(marker)
          if i!=-1:
              s=s[:i]+'''// hide passed subjects in the new-problem subject selector
(function(){
  var original=window.refreshSubjectSelect;
  if(typeof original!==\"function\")return;
  window.refreshSubjectSelect=function(){
    original.apply(this,arguments);
    var el=document.getElementById(\"recordSubject\");
    if(!el||typeof subjects===\"undefined\")return;
    Array.from(el.options).forEach(function(o){
      var sub=subjects.find(function(x){return x.id===o.value});
      if(sub&&sub.result===\"passed\")o.remove();
    });
    if(!el.options.length){var o=document.createElement(\"option\");o.value=\"\";o.textContent=\"合格済みのため対象科目なし\";el.appendChild(o)}
  };
  var baseUpdate=window.updateQualification;
  if(typeof baseUpdate===\"function\"){
    window.updateQualification=async function(id){
      var root=document.getElementById(\"panel-qualification\");
      if(root)root.querySelectorAll(\".q-sub-result\").forEach(function(sel){
        if(sel.value===\"合格\")sel.value=\"passed\";
        else if(sel.value===\"不合格\")sel.value=\"failed\";
      });
      try{return await baseUpdate.apply(this,arguments)}finally{
        if(root)root.querySelectorAll(\".q-sub-result\").forEach(function(sel){
          if(sel.value===\"passed\")sel.value=\"合格\";
          else if(sel.value===\"failed\")sel.value=\"不合格\";
        });
      }
    };
  }
})();
'''
          p.write_text(s)
          p=Path('weakness.html')
          s=p.read_text()
          s=s.replace("select('id,name,qualification_id,sort_order')","select('id,name,qualification_id,sort_order,result')")
          s=s.replace("x.result!=='合格'","x.result!=='passed'")
          s=s.replace("s.result!=='合格'","s.result!=='passed'")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualification-subject-tabs.js weakness.html
          git commit -m "fix: repair passed subject handling" || exit 0
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-passed-subjects.yml
          git add .github/workflows/fix-passed-subjects.yml
          git commit -m "chore: remove temporary fix workflow" || exit 0
          git push