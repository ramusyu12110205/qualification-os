name: Temporary retro review fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retro-review-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch retro review logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('function addRetroReviewRow(')
          end = text.index('async function saveStudyRecord()', start)

          new_block = r'''function addRetroReviewRow(defaultDate=''){
            syncRetroReviewStateFromDOM();
            const studyDate=document.getElementById('recordDate')?.value;
            const maxDate=today();
            const allNames=getRetroProblemNames();
            if(!studyDate||!allNames.length)return;

            let problemNames=allNames;
            if(retroReviewRows.length){
              const previous=retroReviewRows[retroReviewRows.length-1];
              problemNames=previous.problemNames.filter(name=>previous.results?.[name]==='wrong');
              if(!problemNames.length){
                alert('前回の復習で不正解だった問題がないため、もう1回追加する必要はありません。');
                return;
              }
            }

            let date=defaultDate;
            if(!date){
              const last=retroReviewRows[retroReviewRows.length-1];
              if(last){
                const maxStage=Math.max(...problemNames.map(n=>last.results?.[n]==='wrong'?last.stage:last.stage+1));
                const gap=maxStage<=1?1:maxStage===2?3:maxStage===3?7:maxStage===4?14:1;
                date=addDays(last.date,gap);
              }else{
                date=addDays(studyDate,1);
              }
            }
            if(date>maxDate)date=maxDate;
            if(date<=studyDate)date=addDays(studyDate,1);

            retroReviewRows.push({
              stage:retroReviewRows.length+1,
              date,
              problemNames:[...problemNames],
              results:Object.fromEntries(problemNames.map(n=>[n,'correct']))
            });
            renderRetroReviewPanel();
          }

          function removeRetroReviewRow(index){
            syncRetroReviewStateFromDOM();
            retroReviewRows.splice(index,1);
            retroReviewRows.forEach((r,i)=>r.stage=i+1);
            renderRetroReviewPanel();
          }

          function updateRetroReviewRow(index,key,value){
            if(!retroReviewRows[index])return;
            retroReviewRows[index][key]=value;
          }

          function updateRetroReviewResult(rowIndex,problemName,result){
            if(!retroReviewRows[rowIndex])return;
            retroReviewRows[rowIndex].results ||= {};
            retroReviewRows[rowIndex].results[problemName]=result;
          }

          function renderRetroReviewPanel(){
            const panel=document.getElementById('retroReviewPanel');
            const type=document.getElementById('activityType')?.value;
            const date=document.getElementById('recordDate')?.value;
            const names=getRetroProblemNames();
            if(!panel)return;
            if(type!=='new_problems'||!date||!names.length||date>=today()){
              panel.style.display='none';panel.innerHTML='';return;
            }

            // 問題欄を編集した場合も、各復習回にすでに含まれている問題の結果は維持する。
            retroReviewRows.forEach(r=>{
              r.problemNames=r.problemNames.filter(n=>names.includes(n));
              const old=r.results||{};
              r.results=Object.fromEntries(r.problemNames.map(n=>[n,old[n]||'correct']));
            });

            panel.style.display='block';
            if(!retroReviewRows.length){
              panel.innerHTML=`<h3>過去に実施した復習</h3>
                <p class="muted small">後から登録する学習について、すでに実施した復習を記録できます。<b>次の復習回には前回不正解だった問題だけが引き継がれます。</b></p>
                <button class="light" type="button" onclick="addRetroReviewRow()">＋ 過去の復習を追加</button>`;
              return;
            }

            const latest=retroReviewRows[retroReviewRows.length-1];
            const latestWrong=(latest.problemNames||[]).filter(n=>latest.results?.[n]==='wrong');
            panel.innerHTML=`<h3>過去に実施した復習</h3>
              <p class="muted small">復習回ごとに、<b>前回不正解だった問題だけ</b>が次の回へ引き継がれます。</p>
              ${retroReviewRows.map((r,i)=>`<div class="item">
                <div class="row" style="justify-content:space-between"><b>復習${i+1}</b><button class="danger" type="button" onclick="removeRetroReviewRow(${i})">削除</button></div>
                <label>実施日</label><input type="date" value="${r.date}" max="${today()}" min="${addDays(date,1)}" onchange="updateRetroReviewRow(${i},'date',this.value)">
                <div style="margin-top:10px">
                  ${(r.problemNames||[]).map(n=>`<div class="row" style="margin:8px 0;align-items:center">
                    <div style="flex:1;min-width:180px"><b>${n}</b></div>
                    <div style="flex:0 1 180px"><select data-retro-row="${i}" data-retro-problem="${n.replace(/\"/g,'&quot;')}" onchange="updateRetroReviewResult(${i},${JSON.stringify(n)},this.value)">
                      <option value="correct" ${r.results?.[n]==='correct'?'selected':''}>正解</option>
                      <option value="wrong" ${r.results?.[n]==='wrong'?'selected':''}>不正解</option>
                    </select></div>
                  </div>`).join('')}
                </div>
              </div>`).join('')}
              ${latestWrong.length
                ? `<button class="light" type="button" onclick="addRetroReviewRow()">＋ もう1回追加（不正解 ${latestWrong.length}問）</button>`
                : `<div class="item"><b>復習完了</b><br><span class="muted small">前回の復習で不正解だった問題がないため、追加の復習回はありません。</span></div>`}`;
          }

          async function saveRetroReviewHistory(problemMap){
            syncRetroReviewStateFromDOM();
            if(!retroReviewRows.length)return;
            const items=[];
            for(const row of retroReviewRows){
              if(!row.date||row.date>today())throw new Error('過去の復習の日付が不正です');
              for(const problemName of (row.problemNames||[])){
                const problemId=problemMap[problemName];
                const result=row.results?.[problemName];
                if(!problemId)throw new Error(`復習${row.stage}の「${problemName}」が見つかりません`);
                if(!result)throw new Error(`復習${row.stage}の「${problemName}」の結果が未設定です`);
                items.push({problem_id:problemId,review_date:row.date,result});
              }
            }
            const {error}=await sb.rpc('backfill_review_history',{p_items:items});
            if(error)throw error;
          }

          '''

          path.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: carry only incorrect retro review items forward"
          git push
