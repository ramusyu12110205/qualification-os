name: Inject transport expense tool
on:
  push:
    paths:
      - 'account-consult.html'
      - '.github/workflows/inject-transport-expense.yml'

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transport-expense-tool.js?v=20261008-1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('body marker not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-consult.html
          git diff --cached --quiet || git commit -m 'Add transportation expense tool to business tools'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/inject-transport-expense.yml
          git add .github/workflows/inject-transport-expense.yml
          git commit -m 'Remove temporary transport tool injection workflow' || true
          git push || true
