name: Inject knowledge AI organizer
on:
  push:
    paths:
      - '.github/workflows/inject-knowledge-ai-organizer.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('knowledge.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="knowledge-ai-organizer.js?v=20261008-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge.html
          git diff --cached --quiet || git commit -m "Integrate AI knowledge organizer"
          git push
      - name: Remove workflow
        run: |
          rm .github/workflows/inject-knowledge-ai-organizer.yml
          git add .github/workflows/inject-knowledge-ai-organizer.yml
          git commit -m "Remove temporary knowledge organizer workflow"
          git push