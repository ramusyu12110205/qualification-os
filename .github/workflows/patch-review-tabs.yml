name: patch-review-tabs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-review-tabs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review selection buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""function selectSubjectDue(subjectId,v){\n  dueItems().filter(p=>(reviewFilter==='all'||reviewBucket(p)===reviewFilter)&&p.subject_id===subjectId).forEach(p=>v?reviewSelectedIds.add(p.id):reviewSelectedIds.delete(p.id));\n  renderReviewList();\n}"""
          new="""function selectSubjectDue(subjectId,v){\n  dueItems().filter(p=>(reviewFilter==='all'||reviewBucket(p)===reviewFilter)&&p.subject_id===subjectId).forEach(p=>v?reviewSelectedIds.add(p.id):reviewSelectedIds.delete(p.id));\n  document.querySelectorAll('.dueCheck').forEach(x=>{const p=problems.find(p=>p.id===x.dataset.id);if(p?.subject_id===subjectId)x.checked=v;});\n}"""
          if old not in s: raise SystemExit('selectSubjectDue target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '復習の全選択と解除でタブを閉じないよう修正'
          git push
