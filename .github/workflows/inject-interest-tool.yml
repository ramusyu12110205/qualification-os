name: Inject interest business tool
on:
  push:
    paths:
      - '.github/workflows/inject-interest-tool.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="interest-tool.js?v=20261008-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add account-consult.html
          git commit -m "Add interest withholding tool"
          git rm .github/workflows/inject-interest-tool.yml
          git commit -m "Remove temporary interest tool workflow"
          git push
