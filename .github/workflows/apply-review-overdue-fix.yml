name: Apply overdue review fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch overdue review handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = "function dueItems(){\n  const t=today();\n  return problems.filter(p=>p.status==='pending' && p.next_review_date===t);\n}"
          new = "function dueItems(){\n  const t=today();\n  // 期限を過ぎた復習も未消化として今日の復習対象に含める。\n  return problems.filter(p=>p.status==='pending' && p.next_review_date && p.next_review_date<=t);\n}"
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('dueItems already patched or target not found')

          old = '<p class="muted small">今日が復習日になっている問題だけ表示します。</p>'
          new = '<p class="muted small">今日までに復習する予定だった問題を表示します。期限を過ぎた復習も未消化として残ります。</p>'
          if old in text:
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          rm -rf debug-source
          rm -f .github/workflows/inspect-source.yml .github/workflows/apply-review-overdue-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: overdue reviews'
          git push
