name: Hotfix dashboard mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore qualification overview max calculation and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('study-dashboard-enhance.js')
          s = p.read_text(encoding='utf-8')
          needle = "    var cards=rows.length?rows.map(function(x){"
          fix = "    var max=rows.reduce(function(a,x){return Math.max(a,x.p.total)},0)||1;\n"
          if needle not in s:
              raise SystemExit('target text not found')
          if fix.strip() not in s:
              s = s.replace(needle, fix + needle, 1)
              p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/hotfix-dashboard-mode.yml')
          if wf.exists():
              wf.unlink()
          PY
          if git diff --quiet; then
            echo 'No hotfix needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study-dashboard-enhance.js .github/workflows/hotfix-dashboard-mode.yml
          git commit -m 'Fix qualification overview tab rendering'
          git push
