name: Bump transport tool cache
on:
  push:
    paths:
      - 'transport-expense-tool.js'
      - '.github/workflows/bump-transport-cache.yml'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('transport-expense-tool.js?v=20261008-1','transport-expense-tool.js?v=20261008-2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-consult.html
          git diff --cached --quiet || git commit -m 'Bump transport tool cache version'
          git push
          rm -f .github/workflows/bump-transport-cache.yml
          git add .github/workflows/bump-transport-cache.yml
          git commit -m 'Remove temporary transport cache workflow' || true
          git push || true
