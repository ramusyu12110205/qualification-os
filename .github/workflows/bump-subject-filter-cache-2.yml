name: Bump subject filter cache 2

on:
  push:
    paths:
      - '.github/workflows/bump-subject-filter-cache-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump subject filter script cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='qualification-subject-tabs.js?v=20261021-history"></script>'
          new='qualification-subject-tabs.js?v=20261022-passed-subjects"></script>'
          if old not in s:
              raise SystemExit('target script tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit cache bump and remove workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: bust passed subject filter script cache'
          git rm .github/workflows/bump-subject-filter-cache.yml .github/workflows/bump-subject-filter-cache-2.yml
          git commit -m 'chore: remove temporary subject filter cache workflows'
          git push
