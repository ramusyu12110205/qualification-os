name: Apply passed subject filter v2

on:
  push:
    paths:
      - '.github/workflows/apply-passed-subject-filter-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch passed subjects
        shell: python
        run: |
          from pathlib import Path

          p=Path('qualification-subject-tabs.js')
          s=p.read_text(encoding='utf-8')
          marker='// hide passed subjects in new-problem selector'
          if marker not in s:
              s += '''

(function(){
  // hide passed subjects in new-problem selector
  var base=window.refreshSubjectSelect;
  if(typeof base!=='function')return;
  window.refreshSubjectSelect=function(){
    base.apply(this,arguments);
    var s=document.getElementById('recordSubject');
    if(!s || typeof subjects==='undefined')return;
    Array.from(s.options).forEach(function(o){
      var sub=subjects.find(function(x){return x.id===o.value});
      if(sub && sub.result==='合格')o.remove();
    });
    if(!s.options.length){
      var o=document.createElement('option');
      o.value='';
      o.textContent='合格済みのため対象科目なし';
      s.appendChild(o);
    }
    if(s.options.length && !s.value)s.selectedIndex=0;
  };
  setTimeout(function(){window.refreshSubjectSelect()},0);
})();
'''
              p.write_text(s,encoding='utf-8')

          p=Path('weakness.html')
          s=p.read_text(encoding='utf-8')
          old="subjects.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sf.appendChild(o)});render();"
          new="subjects.filter(x=>x.result!=='合格').forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sf.appendChild(o)});render();"
          if old in s:
              s=s.replace(old,new,1)
          old="const rows=problems.map(p=>({p,...statsFor(p)})).filter(x=>(sid==='all'||x.p.subject_id===sid)&&x.wrong.length>=min&&(lastResult==='all'||x.last?.result===lastResult));"
          new="const activeSubjectIds=new Set(subjects.filter(s=>s.result!=='合格').map(s=>s.id));const rows=problems.map(p=>({p,...statsFor(p)})).filter(x=>activeSubjectIds.has(x.p.subject_id)&&(sid==='all'||x.p.subject_id===sid)&&x.wrong.length>=min&&(lastResult==='all'||x.last?.result===lastResult));"
          if old in s:
              s=s.replace(old,new,1)
          old="document.getElementById('totalProblems').textContent=problems.length+'問';document.getElementById('wrongProblems').textContent=problems.filter(p=>statsFor(p).wrong.length>0).length+'問';document.getElementById('wrongTotal').textContent=history.filter(h=>h.result==='wrong').length+'回';document.getElementById('weakProblems').textContent=problems.filter(p=>statsFor(p).wrong.length>=3).length+'問';"
          new="const activeProblems=problems.filter(p=>activeSubjectIds.has(p.subject_id));document.getElementById('totalProblems').textContent=activeProblems.length+'問';document.getElementById('wrongProblems').textContent=activeProblems.filter(p=>statsFor(p).wrong.length>0).length+'問';document.getElementById('wrongTotal').textContent=history.filter(h=>activeSubjectIds.has(problems.find(p=>p.id===h.problem_id)?.subject_id)&&h.result==='wrong').length+'回';document.getElementById('weakProblems').textContent=activeProblems.filter(p=>statsFor(p).wrong.length>=3).length+'問';"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification-subject-tabs.js weakness.html
          git rm -f .github/workflows/hide-passed-subjects.yml .github/workflows/apply-passed-subject-filter.yml .github/workflows/apply-passed-subject-filter-v2.yml
          git commit -m 'feat: hide passed subjects from study and weakness views'
          git push
