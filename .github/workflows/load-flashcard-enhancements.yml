name: Load flashcard enhancements
on:
  push:
    paths:
      - '.github/workflows/load-flashcard-enhancements.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add enhancement scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flashcards.html');s=p.read_text()
          tag='<script src="flashcards-enhance.js"></script><script src="flashcards-init.js"></script>'
          if 'flashcards-enhance.js' not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
          git add flashcards.html
          git rm .github/workflows/load-flashcard-enhancements.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Load flashcard enhancements'
          git push
