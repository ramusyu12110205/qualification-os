name: Bust business tools cache
on:
  push:
    paths:
      - '.github/workflows/bust-business-tools-cache.yml'
permissions:
  contents: write
jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache-busting query
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('business-tools.js?v=20261008-1','business-tools.js?v=20261008-2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add account-consult.html
          git diff --cached --quiet || git commit -m "Bust business tools cache 2"
          git push
