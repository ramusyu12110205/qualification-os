name: Fix retro review UI
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='retroReviewRows[rowIndex].results[problemName]=result;\\n  renderRetroReviewPanel();\\n  renderRetroReviewPanel();'; new='retroReviewRows[rowIndex].results[problemName]=result;\\n  requestAnimationFrame(() => renderRetroReviewPanel());'; assert old in s, 'target not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh retro review follow-up state after result change"
          git push
