name: Fix retro review UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-retro-ui.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """function updateRetroReviewResult(rowIndex,problemName,result){
  if(!retroReviewRows[rowIndex])return;
  retroReviewRows[rowIndex].results ||= {};
  retroReviewRows[rowIndex].results[problemName]=result;
}"""
          new = """function updateRetroReviewResult(rowIndex,problemName,result){
  if(!retroReviewRows[rowIndex])return;
  retroReviewRows[rowIndex].results ||= {};
  retroReviewRows[rowIndex].results[problemName]=result;
  renderRetroReviewPanel();
}"""
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh retro review UI after result change"
          git push
