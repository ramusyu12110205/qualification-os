name: Fix interest default markup
on:
  push:
    paths:
      - '.github/workflows/fix-interest-default.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix markup and cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('interest-tool.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('class="tool-mode" data-taxpayer="corporation" class="tool-mode active" data-taxpayer="corporation"','class="tool-mode active" data-taxpayer="corporation"')
          p.write_text(s,encoding='utf-8')
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8').replace('interest-tool.js?v=20261008-2','interest-tool.js?v=20261008-3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add interest-tool.js account-consult.html
          git commit -m "Fix interest tool default markup"
          git rm .github/workflows/fix-interest-default.yml
          git commit -m "Remove temporary interest fix workflow"
          git push
