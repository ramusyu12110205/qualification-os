name: Cache bust study history

on:
  push:
    paths:
      - '.github/workflows/cachebust-study-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache bust to history script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='qualification-subject-tabs.js"></script>'
          new='qualification-subject-tabs.js?v=20261021-history"></script>'
          if old not in s:
              raise SystemExit('target script tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit cache bust and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: bust study history script cache'
          git rm .github/workflows/cachebust-study-history.yml
          git commit -m 'chore: remove temporary cache bust workflow'
          git push
