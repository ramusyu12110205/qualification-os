name: Fix past study parser regex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped date regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = r"/^\\\\d{4}-\\\\d{2}-\\\\d{2}$/"
          new = r"/^\\d{4}-\\d{2}-\\d{2}$/"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Install study dashboard enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-enhance.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install study dashboard final fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-final-fix.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install subject study time chart
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('qualification-result-enhance-v2.js')
          s = p.read_text(encoding='utf-8')
          marker = 'window.__subjectTimeChartPatchInstalled'
          if marker in s:
              for start_marker in ('\n(function(){\n  function minutesTextChart', r'\n(function(){\n  function minutesTextChart'):
                  pos = s.rfind(start_marker)
                  if pos != -1:
                      s = s[:pos]
                      break
          addition = base64.b64decode('').decode()
          p.write_text(s.rstrip() + '\n' + addition, encoding='utf-8')
          PY
      - name: Commit fix if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qualification-result-enhance-v2.js
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Add subject study time chart'
            git push
          fi
