name: Fix past study parser regex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped date regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = r"/^\\\\d{4}-\\\\d{2}-\\\\d{2}$/"
          new = r"/^\\d{4}-\\d{2}-\\d{2}$/"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Install study dashboard enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-enhance.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install study dashboard final fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-final-fix.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install subject study time chart
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qualification-result-enhance-v2.js')
          s = p.read_text(encoding='utf-8')
          marker = 'window.__subjectTimeChartPatchInstalled'
          if marker in s:
              for start_marker in ("\n(function(){\n  function minutesTextChart", "\\n(function(){\\n  function minutesTextChart"):
                  pos = s.rfind(start_marker)
                  if pos != -1:
                      s = s[:pos]
                      break
          addition = '''
(function(){
  function minutesTextChart(m){m=Math.max(0,Math.round(Number(m)||0));if(!m)return '0分';var h=Math.floor(m/60),min=m%60;return h?(min?h+'時間'+min+'分':h+'時間'):min+'分'}
  function escChart(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function renderChart(id,panel){
    var ss=subjects.filter(function(s){return s.qualification_id===id});
    var rows=ss.map(function(s){return {name:s.name,minutes:sessions.filter(function(x){return x.subject_id===s.id}).reduce(function(a,x){return a+Number(x.minutes||0)},0)}}).filter(function(r){return r.minutes>0}).sort(function(a,b){return b.minutes-a.minutes});
    var total=rows.reduce(function(a,r){return a+r.minutes},0);
    if(!total){panel.innerHTML='<div class="item" style="margin:0"><span class="muted small">まだ科目別の勉強記録がありません。</span></div>';return}
    var palette=['#8b5cf6','#22d3ee','#34d399','#fbbf24','#fb7185','#60a5fa','#a78bfa','#f472b6'];
    var start=0,stops=rows.map(function(r,i){var end=start+r.minutes/total*360,part=palette[i%palette.length];var out=part+' '+start+'deg '+end+'deg';start=end;return out}).join(',');
    var legend=rows.map(function(r,i){var pct=Math.round(r.minutes/total*100);return '<div class="stc-row"><span><i style="background:'+palette[i%palette.length]+'"></i>'+escChart(r.name)+'</span><b>'+pct+'%</b><small>'+minutesTextChart(r.minutes)+'</small></div>'}).join('');
    panel.innerHTML='<div class="stc-wrap"><div class="stc-chart" style="background:conic-gradient('+stops+')"><div class="stc-hole"><strong>'+minutesTextChart(total)+'</strong><span>科目合計</span></div></div><div class="stc-legend">'+legend+'</div></div><div class="muted small" style="margin-top:10px">資格全体の勉強時間を100%として表示しています。</div>';
  }
  var base=window.showQualificationResultAware;
  if(!base||base.__subjectTimeChartWrapped)return;
  window.showQualificationResultAware=function(id){
    var result=base.apply(this,arguments),box=document.getElementById('dashboard'),stat=box&&box.querySelector('.statgrid');
    if(!box||!stat)return result;
    var old=box.querySelector('.subject-time-chart-card');if(old)old.remove();
    var card=document.createElement('div');card.className='item subject-time-chart-card';card.style.margin='12px 0';
    card.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><div><b>科目別の勉強時間</b><div class="muted small">資格全体に占める割合を確認</div></div><button class="light" type="button">📊 円グラフを見る</button></div><div class="subject-time-chart-panel" style="display:none;margin-top:12px"></div>';
    var button=card.querySelector('button'),panel=card.querySelector('.subject-time-chart-panel');
    button.addEventListener('click',function(){var open=panel.style.display!=='none';panel.style.display=open?'none':'block';button.textContent=open?'📊 円グラフを見る':'📊 円グラフを閉じる';if(!open)renderChart(id,panel)});
    stat.insertAdjacentElement('afterend',card);
    return result;
  };
  window.showQualificationResultAware.__subjectTimeChartWrapped=true;
  var style=document.createElement('style');style.textContent='.stc-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.stc-chart{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}.stc-hole{width:112px;height:112px;border-radius:50%;background:#0e1422;border:1px solid #26314d;display:flex;flex-direction:column;align-items:center;justify-content:center}.stc-hole strong{font-size:18px}.stc-hole span{font-size:11px;color:#98a3bf}.stc-legend{flex:1;min-width:220px}.stc-row{display:grid;grid-template-columns:minmax(0,1fr) 48px 74px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #26314d}.stc-row>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stc-row i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.stc-row b{text-align:right}.stc-row small{text-align:right;color:#98a3bf}@media(max-width:700px){.stc-wrap{justify-content:center}.stc-chart{width:170px;height:170px}.stc-hole{width:102px;height:102px}.stc-legend{width:100%}}';document.head.appendChild(style);
  window.__subjectTimeChartPatchInstalled=true;
})();
'''
          p.write_text(s + addition, encoding='utf-8')
          PY
      - name: Commit fix if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qualification-result-enhance-v2.js
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Add subject study time chart'
            git push
          fi
