name: Fix past study parser regex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped date regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = r"/^\\\\d{4}-\\\\d{2}-\\\\d{2}$/"
          new = r"/^\\d{4}-\\d{2}-\\d{2}$/"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Install study dashboard enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-enhance.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install study dashboard final fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="study-dashboard-final-fix.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Install subject study time chart
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qualification-result-enhance-v2.js')
          s = p.read_text(encoding='utf-8')
          if 'window.__subjectTimeChartPatchInstalled' in s:
              pos = s.rfind('function minutesTextChart')
              if pos != -1:
                  start = s.rfind('(function(){', 0, pos)
                  if start != -1:
                      s = s[:start]
                      p.write_text(s.rstrip() + '\n', encoding='utf-8')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="subject-time-chart.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  p.write_text(s.replace(marker, tag + '\n' + marker, 1), encoding='utf-8')
          PY
      - name: Restore accounting consultation page
        run: |
          git show 59083a8a2432df37f77d57448ec3d250aec5719a:account-consult.html > account-consult.html
          python - <<'PY'
          from pathlib import Path
          p = Path('account-consult.html')
          s = p.read_text(encoding='utf-8')
          old = "redirectTo:location.origin+'/qualification-os/'"
          new = "redirectTo:location.origin+'/qualification-os/account-consult.html'"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qualification-result-enhance-v2.js account-consult.html
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Restore accounting consultation page and login return'
            git push
          fi
