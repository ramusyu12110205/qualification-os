name: Fix retro result UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch result selector rendering
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"\$\{r\.selected\?\.\[n\] \? `<div style=\"flex:0 1 180px\"><select data-retro-row=\"\$\{i\}\" data-retro-problem=\"\$\{n\.replace\(/\\\\\\\"/g,'&quot;'\)\}\" onchange=\"updateRetroReviewResult\(\$\{i\},\$\{JSON\.stringify\(n\)\},this\.value\)\">\s*<option value=\"correct\" \$\{r\.results\?\.\[n\]==='correct'\?'selected':''\}>正解</option>\s*<option value=\"wrong\" \$\{r\.results\?\.\[n\]==='wrong'\?'selected':''\}>不正解</option>\s*</select></div>` : ''\}"
          replacement="""<div style=\"flex:0 1 180px\"><select data-retro-row=\"${i}\" data-retro-problem=\"${n.replace(/\\\"/g,'&quot;')}\" ${r.selected?.[n]?'':'disabled'} onchange=\"updateRetroReviewResult(${i},${JSON.stringify(n)},this.value)\">
            <option value=\"correct\" ${r.results?.[n]==='correct'?'selected':''}>正解</option>
            <option value=\"wrong\" ${r.results?.[n]==='wrong'?'selected':''}>不正解</option>
          </select></div>"""
          ns,c=re.subn(pattern,replacement,s,count=1)
          if c!=1: raise SystemExit(f'target selector not found: {c}')
          p.write_text(ns,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: show result selector for checked retro problems [skip ci]"
          git push
