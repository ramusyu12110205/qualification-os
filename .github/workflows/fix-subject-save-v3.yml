name: Repair subject upsert
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append repair
        run: |
          if ! grep -q 'SUBJECT_UPSERT_REPAIR' qualification-subject-tabs.js; then
            cat >> qualification-subject-tabs.js <<'EOF'

/* SUBJECT_UPSERT_REPAIR */
(function(){
  if(typeof sb==='undefined' || sb.__subjectUpsertRepair)return;
  var originalFrom=sb.from.bind(sb);
  sb.from=function(table){
    var q=originalFrom(table);
    if(table==='subjects'){
      q.insert=function(values){
        return q.upsert(values,{onConflict:'user_id,qualification_id,name'});
      };
    }
    return q;
  };
  sb.__subjectUpsertRepair=true;
})();
EOF
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add qualification-subject-tabs.js
            git commit -m 'fix: upsert subjects on save'
            git push
          fi
