name: patch-review-selection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-review-selection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review selection behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_render = r'''function renderReviewList(){
            const list=document.getElementById('reviewSelectionList');
            if(!list)return;
            const openSubjects=new Set([...list.querySelectorAll('details[data-subject][open]')].map(x=>x.dataset.subject));
            const due=dueItems().filter(p=>reviewFilter==='all'||reviewBucket(p)===reviewFilter);
            const groups={};
            due.forEach(p=>{if(!groups[p.subject_id])groups[p.subject_id]=[];groups[p.subject_id].push(p)});
            Object.values(groups).forEach(arr=>arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja',{numeric:true,sensitivity:'base'})));
            list.innerHTML=Object.entries(groups).map(([sid,arr])=>{
              const sub=subjects.find(s=>s.id===sid),q=qualifications.find(q=>q.id===sub?.qualification_id);
              return `<details data-subject="${sid}" style="margin:10px 0" ${openSubjects.has(sid)?'open':''}><summary style="cursor:pointer;font-weight:900">${esc(q?.name||"資格")} / ${esc(sub?.name||"科目")} <span class="badge">${arr.length}問</span></summary>`+
                `<div style="padding-top:7px"><div class="row" style="margin-bottom:8px"><button type="button" class="light" data-subject="${sid}" onclick="selectSubjectDue(this.dataset.subject,true)">この科目を全選択</button><button type="button" class="light" data-subject="${sid}" onclick="selectSubjectDue(this.dataset.subject,false)">この科目を全解除</button></div>`+
                arr.map(p=>`<label class="item" style="display:flex;gap:10px;align-items:center;cursor:pointer"><input class="dueCheck" type="checkbox" data-id="${p.id}" ${reviewSelectedIds.has(p.id)?'checked':''} onchange="toggleReviewSelection(this)" style="width:auto"><span><b>${esc(p.name)}</b><br><span class="muted small">実施 ${p.attempts}回 ・ ${p.last_result==="wrong"?"再復習":p.stage===0?"初回翌日":([1,3,7,14,30][p.stage]??"?")+"日後"}</span></span></label>`).join("")+`</div></details>`;
            }).join("");
          }
          '''
          pattern=r'function renderReviewList\(\)\{.*?(?=function setReviewFilter\()'
          s2,n=re.subn(pattern,new_render,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'renderReviewList replace failed: {n}')
          s=s2
          new_open = r'''function openReviewSelection(){
            reviewFilter='all';
            reviewSelectedIds.clear();
            dueItems().forEach(p=>reviewSelectedIds.add(p.id));
            const panel=document.getElementById('reviewSelectionPanel');
            if(panel){panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth',block:'start'});}
            renderReviewList();
          }
          '''
          pattern=r'function openReviewSelection\(\)\{.*?(?=function closeReviewSelection\()'
          s2,n=re.subn(pattern,new_open,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'openReviewSelection replace failed: {n}')
          s=s2
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '復習選択の初期状態とタブ保持を修正'
          git push
