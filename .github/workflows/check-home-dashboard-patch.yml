name: Check home dashboard patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-home-dashboard-patch.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '今日やる問題' in s
          print('home dashboard patch verified')
          PY
      - name: Remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-home-dashboard-patch.yml
          git commit -m 'Verify home dashboard patch'
          git push
