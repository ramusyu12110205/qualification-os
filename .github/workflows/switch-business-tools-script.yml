name: Switch business tools script
on:
  push:
    paths:
      - '.github/workflows/switch-business-tools-script.yml'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('business-tools.js?v=20261008-2','business-tools-v2.js')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add account-consult.html
          git diff --cached --quiet || git commit -m "Use fresh business tools script"
          git push
