name: inject-subject-tabs
on:
  push:
    paths:
      - '.github/workflows/inject-subject-tabs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject subject tabs script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="qualification-subject-tabs.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('body marker not found')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/inject-subject-tabs.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/inject-subject-tabs.yml
          git diff --cached --quiet && exit 0
          git commit -m '資格設定の科目をタブ式に戻す'
          git push
