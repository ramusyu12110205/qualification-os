name: patch-review-default-selection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-review-default-selection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch default selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="onclick=\"reviewFilter='all'; reviewSelectedIds.clear(); dueItems().forEach(p=>reviewSelectedIds.add(p.id)); openReviewSelection()\""
          new="onclick=\"reviewFilter='all'; reviewSelectedIds.clear(); openReviewSelection()\""
          if old not in s: raise SystemExit('default selection target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '復習選択のデフォルトを未選択に修正'
          git push
