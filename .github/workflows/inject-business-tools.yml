name: Inject business tools
on:
  push:
    paths:
      - 'business-tools.js'
      - '.github/workflows/inject-business-tools.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('account-consult.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="business-tools.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account-consult.html
          git diff --cached --quiet || git commit -m "Add business tools to accounting consult"
          git push
