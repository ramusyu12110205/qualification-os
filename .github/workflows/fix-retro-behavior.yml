name: Fix retro review behavior

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch retro review behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function syncRetroReviewStateFromDOM(){')
          end = s.index('async function saveStudyRecord(){', start)
          new = r'''function syncRetroReviewStateFromDOM(){
            document.querySelectorAll('#retroReviewPanel [data-retro-row]').forEach(el=>{
              const rowIndex=Number(el.dataset.retroRow);
              if(!Number.isInteger(rowIndex)||!retroReviewRows[rowIndex])return;
              retroReviewRows[rowIndex].selected ||= {};
              const name=el.dataset.retroProblem;
              if(el.type==='checkbox'){
                retroReviewRows[rowIndex].selected[name]=el.checked;
              }else if(el.tagName==='SELECT'){
                retroReviewRows[rowIndex].results ||= {};
                retroReviewRows[rowIndex].results[name]=el.value;
              }
            });
          }

          function getRetroProblemNames(){
            const raw=document.getElementById('recordProblems')?.value.trim()||'';
            return [...new Set(raw.split(/\n|,|、/).map(x=>x.trim()).filter(Boolean))];
          }

          function addRetroReviewRow(defaultDate=''){
            syncRetroReviewStateFromDOM();
            const studyDate=document.getElementById('recordDate')?.value;
            const maxDate=today();
            const allNames=getRetroProblemNames();
            if(!studyDate||!allNames.length)return;
            let date=defaultDate;
            if(!date){
              const last=retroReviewRows[retroReviewRows.length-1];
              if(last){
                const selected=last.problemNames||[];
                const wrong=selected.filter(n=>last.results?.[n]==='wrong');
                const nextStage=wrong.length ? last.stage : last.stage+1;
                const gap=nextStage<=1?1:nextStage===2?3:nextStage===3?7:nextStage===4?14:30;
                date=addDays(last.date,gap);
              }else date=addDays(studyDate,1);
            }
            if(date>maxDate)date=maxDate;
            if(date<=studyDate)date=addDays(studyDate,1);
            const selectedNames=retroReviewRows.length
              ? (retroReviewRows[retroReviewRows.length-1].problemNames||[]).filter(n=>retroReviewRows[retroReviewRows.length-1].results?.[n]==='wrong')
              : allNames;
            retroReviewRows.push({
              stage:retroReviewRows.length+1,
              date,
              problemNames:[...selectedNames],
              selected:Object.fromEntries(allNames.map(n=>[n,selectedNames.includes(n)])),
              results:Object.fromEntries(selectedNames.map(n=>[n,'correct']))
            });
            renderRetroReviewPanel();
          }

          function removeRetroReviewRow(index){
            syncRetroReviewStateFromDOM();
            retroReviewRows.splice(index,1);
            retroReviewRows.forEach((r,i)=>r.stage=i+1);
            renderRetroReviewPanel();
          }

          function updateRetroReviewRow(index,key,value){
            if(!retroReviewRows[index])return;
            retroReviewRows[index][key]=value;
          }

          function updateRetroReviewSelection(rowIndex,problemName,checked){
            if(!retroReviewRows[rowIndex])return;
            retroReviewRows[rowIndex].selected ||= {};
            retroReviewRows[rowIndex].selected[problemName]=checked;
            const row=retroReviewRows[rowIndex];
            row.problemNames=Object.keys(row.selected).filter(n=>row.selected[n]);
            row.results ||= {};
            if(checked && !row.results[problemName])row.results[problemName]='correct';
            renderRetroReviewPanel();
          }

          function updateRetroReviewResult(rowIndex,problemName,result){
            if(!retroReviewRows[rowIndex])return;
            retroReviewRows[rowIndex].results ||= {};
            retroReviewRows[rowIndex].results[problemName]=result;
            requestAnimationFrame(()=>renderRetroReviewPanel());
          }

          function renderRetroReviewPanel(){
            const panel=document.getElementById('retroReviewPanel');
            const type=document.getElementById('activityType')?.value;
            const date=document.getElementById('recordDate')?.value;
            const names=getRetroProblemNames();
            if(!panel)return;
            if(type!=='new_problems'||!date||!names.length||date>=today()){
              panel.style.display='none';panel.innerHTML='';return;
            }
            retroReviewRows.forEach(r=>{
              r.selected ||= {};
              const oldResults=r.results||{};
              const oldSelected=r.selected||{};
              r.selected=Object.fromEntries(names.map(n=>[n,oldSelected[n] ?? (r.problemNames||[]).includes(n)]));
              r.problemNames=names.filter(n=>r.selected[n]);
              r.results=Object.fromEntries(r.problemNames.map(n=>[n,oldResults[n]||'correct']));
            });
            panel.style.display='block';
            if(!retroReviewRows.length){
              panel.innerHTML=`<h3>過去に実施した復習</h3>
                <p class="muted small">過去に実施した復習を任意で追加できます。追加した復習では、実施した問題だけを選択し、正解／不正解を記録します。</p>
                <button class="light" type="button" onclick="addRetroReviewRow()">＋ 過去の復習を追加</button>`;
              return;
            }
            panel.innerHTML=`<h3>過去に実施した復習</h3>
              <p class="muted small">復習回は任意で追加できます。次の回には前回不正解だった問題が自動で選択されますが、他の問題も自由に追加できます。</p>
              ${retroReviewRows.map((r,i)=>`<div class="item">
                <div class="row" style="justify-content:space-between"><b>復習${i+1}</b><button class="danger" type="button" onclick="removeRetroReviewRow(${i})">削除</button></div>
                <label>実施日</label><input type="date" value="${r.date}" max="${today()}" min="${addDays(date,1)}" onchange="updateRetroReviewRow(${i},'date',this.value)">
                <div style="margin-top:10px">
                  ${names.map(n=>`<div class="row" style="margin:8px 0;align-items:center">
                    <label style="flex:1;min-width:180px;margin:0;display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" data-retro-row="${i}" data-retro-problem="${n.replace(/\"/g,'&quot;')}" ${r.selected?.[n]?'checked':''} onchange="updateRetroReviewSelection(${i},${JSON.stringify(n)},this.checked)" style="width:auto">${esc(n)}</label>
                    ${r.selected?.[n] ? `<div style="flex:0 1 180px"><select data-retro-row="${i}" data-retro-problem="${n.replace(/\"/g,'&quot;')}" onchange="updateRetroReviewResult(${i},${JSON.stringify(n)},this.value)">
                      <option value="correct" ${r.results?.[n]==='correct'?'selected':''}>正解</option>
                      <option value="wrong" ${r.results?.[n]==='wrong'?'selected':''}>不正解</option>
                    </select></div>` : ''}
                  </div>`).join('')}
                </div>
              </div>`).join('')}
              <button class="light" type="button" onclick="addRetroReviewRow()">＋ もう1回追加</button>`;
          }

          async function saveRetroReviewHistory(problemMap){
            syncRetroReviewStateFromDOM();
            if(!retroReviewRows.length)return;
            const items=[];
            for(const row of retroReviewRows){
              if(!row.date||row.date>today())throw new Error('過去の復習の日付が不正です');
              for(const problemName of (row.problemNames||[])){
                const problemId=problemMap[problemName];
                const result=row.results?.[problemName];
                if(!problemId)throw new Error(`復習${row.stage}の「${problemName}」が見つかりません`);
                if(!result)throw new Error(`復習${row.stage}の「${problemName}」の結果が未設定です`);
                items.push({problem_id:problemId,review_date:row.date,result});
              }
            }
            const {error}=await sb.rpc('backfill_review_history',{p_items:items});
            if(error)throw error;
          }

          '''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make retro review additions optional"
          git push
