name: patch-review-stock-from-selection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-review-stock-from-selection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review selection actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button class="light" onclick="setReviewFilter('all')">すべて表示</button><button class="light" onclick="setVisibleReviewSelection(true)">表示中を全選択</button><button class="light" onclick="setVisibleReviewSelection(false)">表示中を全解除</button><button class="primary" onclick="startReview()">選択した問題を復習</button>'''
          new='''<button class="light" onclick="setReviewFilter('all')">すべて表示</button><button class="light" onclick="setVisibleReviewSelection(true)">表示中を全選択</button><button class="light" onclick="setVisibleReviewSelection(false)">表示中を全解除</button><button class="primary" onclick="startReview()">選択した問題を復習</button><button class="light" onclick="window.addSelectedToPriority()">⭐ 選択した問題を今日やる</button>'''
          if old not in s:
              raise SystemExit('review selection action row not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '復習選択画面から今日やる問題を追加可能にする'
          git push
