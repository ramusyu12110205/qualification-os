name: Repair subject save v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qualification-subject-tabs.js')
          s = p.read_text()
          s = s.replace('value="合格"', 'value="passed"')
          s = s.replace('value="不合格"', 'value="failed"')
          old = '''      }else{
        var ins=await sb.from('subjects').insert({user_id:currentUser.id,qualification_id:id,name:row.name,result:dbResult,sort_order:i,archived:false}).select().single();
        if(ins.error){alert('科目の追加に失敗しました: '+ins.error.message);return}
        keepIds.push(ins.data.id);
      }'''
          new = '''      }else{
        var existing=await sb.from('subjects').select('id').eq('user_id',currentUser.id).eq('qualification_id',id).eq('name',row.name).maybeSingle();
        if(existing.error){alert('科目の確認に失敗しました: '+existing.error.message);return}
        if(existing.data){
          var eu=await sb.from('subjects').update({result:dbResult,sort_order:i,archived:false}).eq('id',existing.data.id).eq('user_id',currentUser.id);
          if(eu.error){alert('科目の更新に失敗しました: '+eu.error.message);return}
          keepIds.push(existing.data.id);
        }else{
          var ins=await sb.from('subjects').insert({user_id:currentUser.id,qualification_id:id,name:row.name,result:dbResult,sort_order:i,archived:false}).select().single();
          if(ins.error){alert('科目の追加に失敗しました: '+ins.error.message);return}
          keepIds.push(ins.data.id);
        }
      }'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification-subject-tabs.js
          git commit -m 'fix: reuse existing subjects when saving result' || true
          git push
