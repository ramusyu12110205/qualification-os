name: Inspect qualification source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split index for inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          out = Path('debug-source')
          out.mkdir(exist_ok=True)
          size = 12000
          for p in out.glob('chunk-*.txt'):
              p.unlink()
          for i in range(0, len(text), size):
              (out / f'chunk-{i//size+1:03}.txt').write_text(text[i:i+size], encoding='utf-8')
          print(f'created {len(list(out.glob("chunk-*.txt")))} chunks')
      - name: Commit inspection files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-source
          git diff --cached --quiet || git commit -m 'chore: inspect qualification source'
          git push
