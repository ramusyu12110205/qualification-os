name: Attach flashcard scripts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-flashcard-scripts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach enhancement scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('flashcards.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="flashcards-enhance.js"></script><script src="flashcards-init.js"></script>'
          if tags not in s:
              if '</body>' not in s:
                  raise SystemExit('closing body tag not found')
              s = s.replace('</body>', tags + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flashcards.html
          git rm .github/workflows/attach-flashcard-scripts.yml
          git commit -m 'Attach flashcard enhancement scripts'
          git push
