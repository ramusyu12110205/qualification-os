name: Attach flashcard scripts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach enhancement scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('flashcards.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="flashcards-enhance.js"></script><script src="flashcards-init.js"></script>'
          if tags not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('closing body tag not found')
              s = s.replace(marker, tags + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('scripts already attached')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flashcards.html
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Attach flashcard enhancement scripts'
            git push
          fi
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/attach-flashcard-scripts.yml
          git add .github/workflows/attach-flashcard-scripts.yml
          git commit -m 'Remove temporary flashcard patch workflow'
          git push
