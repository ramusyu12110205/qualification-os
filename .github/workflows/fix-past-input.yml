name: Fix past study input parser

on:
  push:
    paths:
      - DEPLOY_TRIGGER.md
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "const parts=line.split('|').map(x=>x.trim());"
          new = "const parts=line.split(/[|｜]/).map(x=>x.trim());"
          if old not in s:
              raise SystemExit('split target not found')
          s = s.replace(old, new, 1)

          old = "const minutes=Number(minutesText);"
          new = "const minutes=Number(String(minutesText).replace(/分$/,'').trim());"
          if old not in s:
              raise SystemExit('minutes target not found')
          s = s.replace(old, new, 1)

          old = "if(parts.length<4){\n      errors.push(`${i+1}行目：「日付｜科目｜内容｜分｜メモ」の5列で入力してください`);"
          new = "if(parts.length<4){\n      errors.push(`${i+1}行目：「日付｜科目｜内容｜分｜メモ」の形式で入力してください`);"
          if old not in s:
              raise SystemExit('error-message target not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix past study input parser"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-past-input.yml
          git commit -m "Remove one-time parser patch workflow"
          git push
