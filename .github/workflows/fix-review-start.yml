name: fix-review-start
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-review-start.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review start button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="review-start-btn" onclick="openReviewSelection()">復習を始める →</button>'
          new = '<button class="review-start-btn" onclick="reviewFilter=\'all\'; reviewSelectedIds.clear(); dueItems().forEach(p=>reviewSelectedIds.add(p.id)); openReviewSelection()">復習を始める →</button>'
          if old not in s:
              raise SystemExit('target button not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '復習開始時は全復習を選択'
          git push
