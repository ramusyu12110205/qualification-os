name: Fix review record deletion
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=\"async function deleteStudySession(id){\\n  if(!confirm('この勉強記録を削除しますか？'))return;\\n  const {error}=await sb.from('study_sessions')\\n    .delete()\\n    .eq('id',id).eq('user_id',currentUser.id);\\n  if(error){alert('勉強記録の削除に失敗しました: '+error.message);return}\\n  await loadAll();\\n  renderRecordManagerInline();\\n  toast('削除しました');\\n}\"; new=\"async function deleteStudySession(id){\\n  if(!confirm('この勉強記録を削除しますか？\\\\n\\\\n復習記録の場合は、関連する復習履歴も取り消して復習状態を再計算します。'))return;\\n  const {error}=await sb.rpc('delete_study_session_and_rebuild',{p_session_id:id});\\n  if(error){alert('勉強記録の削除に失敗しました: '+error.message);return}\\n  await loadAll();\\n  renderRecordManagerInline();\\n  toast('削除しました。復習状態も更新しました');\\n}\"; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix review state when deleting study records' || exit 0
          git push
