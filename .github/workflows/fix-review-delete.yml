name: Fix review record deletion

on:
  push:
    paths:
      - '.github/workflows/fix-review-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """async function deleteStudySession(id){
  if(!confirm('この勉強記録を削除しますか？'))return;
  const {error}=await sb.from('study_sessions')
    .delete()
    .eq('id',id).eq('user_id',currentUser.id);
  if(error){alert('勉強記録の削除に失敗しました: '+error.message);return}
  await loadAll();
  renderRecordManagerInline();
  toast('削除しました');
}"""
          new = """async function deleteStudySession(id){
  if(!confirm('この勉強記録を削除しますか？\\n\\n復習記録の場合は、関連する復習履歴も取り消して復習状態を再計算します。'))return;
  const {error}=await sb.rpc('delete_study_session_and_rebuild',{p_session_id:id});
  if(error){alert('勉強記録の削除に失敗しました: '+error.message);return}
  await loadAll();
  renderRecordManagerInline();
  toast('削除しました。復習状態も更新しました');
}"""
          if old not in s:
              raise SystemExit('target deleteStudySession block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix review state when deleting study records'
          git push
